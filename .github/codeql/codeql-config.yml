name: "DSD-neo CodeQL config"

queries:
  - uses: security-and-quality

# Keep quality coverage enabled, but do not publish repo-specific noise as
# security alerts. These rules are covered by local review/CI practices or are
# known false positives for this test-heavy C/C++ codebase.
query-filters:
  - exclude:
      id: cpp/poorly-documented-function
  - exclude:
      id: cpp/unused-static-function
  - exclude:
      id: cpp/include-non-header
  - exclude:
      id: cpp/useless-expression

# Keep vendored upstream libraries out of project-owned CodeQL results. The
# traced C/C++ build still analyzes the vendored files tests compile, so the
# codeql workflow also drops results under these paths from the SARIF
# (tools/sarif_drop_ignored_paths.py). Keep this a block list of quoted
# '*'/'**' globs.
paths-ignore:
  - "src/third_party/**"
  - "android/third_party/**"
