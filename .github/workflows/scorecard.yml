name: scorecard

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: [linux-ci]
    types: [completed]
    branches: [main, master]
  schedule:
    - cron: "37 5 * * 1"

permissions:
  checks: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  scorecard:
    name: OpenSSF Scorecard
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.head_sha == github.sha &&
         github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    concurrency:
      group: ci-fast-2
      cancel-in-progress: false
      queue: max
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
      issues: read
      id-token: write
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job condition requires the triggering push to match this trusted SHA.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF
        if: always() && hashFiles('scorecard.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scorecard.sarif
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}

      - name: Upload Scorecard output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-report
          path: scorecard.sarif
          include-hidden-files: true
          retention-days: 7
