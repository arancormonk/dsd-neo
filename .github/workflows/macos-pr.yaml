name: macos-pr

# A job an `if:` skips still reports a check run under its name, as a success. In a
# workflow that a push or a dispatch can also start, a skipped run of a required
# pull-request job on a pull request's head commit could stand in for the real
# one, so the required jobs that only make sense on a pull request live here, in a
# workflow that nothing else starts, and carry no event condition.
#
# macos-ci keeps the push, tag and dispatch jobs (the DMG) and the Debug ctest
# job, which runs on every event.

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A classifier error or missing output runs the affected checks in full.
  changes:
    if: github.event_name == 'pull_request'
    # Keep the local workflow syntax understood by actionlint 1.7.12.
    uses: ./.github/workflows/ci-changes.yml # zizmor: ignore[self-repository]

  build-portable-dmg:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.native_needed != 'false') }}
    runs-on: macos-latest
    concurrency:
      group: ci-worker-13
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compute dependency SHAs (for cache key)
        id: dep-shas
        shell: bash
        run: |
          set -euo pipefail
          {
            source tools/ci-dependency-pins.env
            echo "mbe_sha=$MBELIB_NEO_SHA"
            echo "codec2_sha=$CODEC2_SHA"
            echo "rtlsdr_sha=$RTL_SDR_SHA"
            echo "airspy_sha=$AIRSPY_SHA"
            # dsd-neo's libairspy and librtlsdr patches (tools/usb_dependency_patches.sh).
            echo "airspy_patches=$(tools/usb_dependency_patches.sh digest libairspy)"
            echo "rtlsdr_patches=$(tools/usb_dependency_patches.sh digest librtlsdr)"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare dependency environment
        shell: bash
        run: |
          set -euxo pipefail
          # Homebrew locations (arm64=/opt/homebrew, x86_64=/usr/local)
          HB_PREFIX=$(brew --prefix)
          {
            echo "DEPS_PREFIX=${GITHUB_WORKSPACE}/.deps"
            echo "HB_PREFIX=$HB_PREFIX"
            echo "PKG_CONFIG_PATH=${GITHUB_WORKSPACE}/.deps/lib/pkgconfig:${GITHUB_WORKSPACE}/.deps/lib64/pkgconfig:${HB_PREFIX}/lib/pkgconfig:/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "CMAKE_PREFIX_PATH=${GITHUB_WORKSPACE}/.deps:${HB_PREFIX}:/usr/local:${CMAKE_PREFIX_PATH:-}"
            echo "DYLD_LIBRARY_PATH=${GITHUB_WORKSPACE}/.deps/lib:${GITHUB_WORKSPACE}/.deps/lib64:${DYLD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"

      # Its own key family: this tree holds the patched libairspy and librtlsdr,
      # which the test job's cache does not.
      - name: Restore dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: deps-dmg-${{ runner.os }}-${{ steps.dep-shas.outputs.mbe_sha }}-${{ steps.dep-shas.outputs.codec2_sha }}-${{ steps.dep-shas.outputs.rtlsdr_sha }}-${{ steps.dep-shas.outputs.airspy_sha }}-${{ steps.dep-shas.outputs.rtlsdr_patches }}-${{ steps.dep-shas.outputs.airspy_patches }}
          restore-keys: |
            deps-dmg-${{ runner.os }}-

      - name: Validate dependency cache
        shell: bash
        run: |
          set -euxo pipefail
          mf="$DEPS_PREFIX/.manifest"
          if [ -d "$DEPS_PREFIX" ]; then
            if [ -f "$mf" ] &&
               grep -Fxq "mbe_sha=${{ steps.dep-shas.outputs.mbe_sha }}" "$mf" &&
               grep -Fxq "codec2_sha=${{ steps.dep-shas.outputs.codec2_sha }}" "$mf" &&
               grep -Fxq "rtlsdr_sha=${{ steps.dep-shas.outputs.rtlsdr_sha }}" "$mf" &&
               grep -Fxq "airspy_sha=${{ steps.dep-shas.outputs.airspy_sha }}" "$mf" &&
               grep -Fxq "rtlsdr_patches=${{ steps.dep-shas.outputs.rtlsdr_patches }}" "$mf" &&
               grep -Fxq "airspy_patches=${{ steps.dep-shas.outputs.airspy_patches }}" "$mf"; then
              echo "Dependency cache manifest matches requested SHAs"
            else
              echo "Dependency cache manifest is missing or stale; clearing $DEPS_PREFIX"
              rm -rf "$DEPS_PREFIX"
            fi
          fi
          mkdir -p "$DEPS_PREFIX"

      - name: Install base toolchain + libs (Homebrew)
        shell: bash
        run: |
          set -euxo pipefail
          # Many deps we build from source (cached) to align with Linux/Windows flows.
          # libairspy and librtlsdr are built below with dsd-neo's transfer patches,
          # so their bottles are not installed: only the patched builds can be found.
          brew install cmake ninja pkg-config ccache \
            libsndfile pulseaudio fftw libusb ncurses soapysdr
          # Prefer Homebrew packages when available
          brew install codec2 || true
          brew --version
          cmake --version
          pkg-config --version

      - name: Prepare ccache environment
        shell: bash
        run: |
          set -euxo pipefail
          {
            echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache"
            echo "CC=ccache clang"
            echo "CXX=ccache clang++"
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_SLOPPINESS=time_macros"
          } >> "$GITHUB_ENV"
          mkdir -p "${GITHUB_WORKSPACE}/.ccache"

      # Restore only: macos-ci's push runs save this cache.
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Initialize ccache
        shell: bash
        run: |
          ccache --version
          ccache --zero-stats
          ccache --set-config=max_size=500M
          ccache --set-config=compression=true

      - name: Build and install mbelib-neo (required, cached)
        shell: bash
        run: |
          set -euxo pipefail
          mf="$DEPS_PREFIX/.manifest"
          want_sha='${{ steps.dep-shas.outputs.mbe_sha }}'
          pc1="$DEPS_PREFIX/lib/pkgconfig/libmbe-neo.pc"
          pc2="$DEPS_PREFIX/lib64/pkgconfig/libmbe-neo.pc"
          if [ -f "$pc1" ] || [ -f "$pc2" ]; then
            if [ -f "$mf" ] && grep -q "^mbe_sha=$want_sha$" "$mf"; then
              echo "Using cached mbelib-neo in $DEPS_PREFIX"
              exit 0
            fi
            echo "Cached mbelib-neo does not match desired SHA; rebuilding"
          fi
          tools/fetch-pinned-git.sh https://github.com/arancormonk/mbelib-neo "$want_sha" /tmp/mbelib-neo
          cmake -S /tmp/mbelib-neo -B /tmp/mbelib-neo/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DMBELIB_ENABLE_NATIVE=OFF -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build /tmp/mbelib-neo/build -j
          cmake --install /tmp/mbelib-neo/build

      - name: Ensure codec2 (cached fallback if not found)
        shell: bash
        run: |
          set -euxo pipefail
          mf="$DEPS_PREFIX/.manifest"
          want_sha='${{ steps.dep-shas.outputs.codec2_sha }}'
          pc1="$DEPS_PREFIX/lib/pkgconfig/codec2.pc"
          pc2="$DEPS_PREFIX/lib64/pkgconfig/codec2.pc"
          if [ -f "$pc1" ] || [ -f "$pc2" ]; then
            if [ -f "$mf" ] && grep -q "^codec2_sha=$want_sha$" "$mf"; then
              echo "Using cached codec2 in $DEPS_PREFIX"
              exit 0
            fi
            echo "Cached codec2 does not match desired SHA; rebuilding"
          else
            if pkg-config --exists codec2; then
              echo "Using system codec2"
              exit 0
            fi
          fi
          tools/fetch-pinned-git.sh https://github.com/arancormonk/codec2 "$want_sha" /tmp/codec2
          cmake -S /tmp/codec2 -B /tmp/codec2/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build /tmp/codec2/build -j
          cmake --install /tmp/codec2/build

      # The pinned sources with dsd-neo's transfer patches (tools/usb_dependency_patches.sh),
      # never a system copy: these are the libraries the DMG bundles.
      - name: Build patched librtlsdr and libairspy (cached)
        shell: bash
        env:
          RTLSDR_SHA: ${{ steps.dep-shas.outputs.rtlsdr_sha }}
          RTLSDR_PATCHES: ${{ steps.dep-shas.outputs.rtlsdr_patches }}
          AIRSPY_SHA: ${{ steps.dep-shas.outputs.airspy_sha }}
          AIRSPY_PATCHES: ${{ steps.dep-shas.outputs.airspy_patches }}
        run: |
          set -euxo pipefail
          mf="$DEPS_PREFIX/.manifest"
          build_patched() {
            local lib="$1" pc="$2" mf_prefix="$3" sha="$4" patches="$5"
            shift 5
            if { [ -f "$DEPS_PREFIX/lib/pkgconfig/$pc.pc" ] || [ -f "$DEPS_PREFIX/lib64/pkgconfig/$pc.pc" ]; } &&
               [ -f "$mf" ] && grep -Fxq "${mf_prefix}_sha=$sha" "$mf" &&
               grep -Fxq "${mf_prefix}_patches=$patches" "$mf"; then
              echo "Using cached patched $lib in $DEPS_PREFIX"
              return
            fi
            tools/usb_dependency_patches.sh fetch "$lib" "/tmp/$lib"
            cmake -S "/tmp/$lib" -B "/tmp/$lib/build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" \
              -DCMAKE_OSX_ARCHITECTURES=arm64 "$@"
            cmake --build "/tmp/$lib/build" -j
            cmake --install "/tmp/$lib/build"
          }
          build_patched librtlsdr librtlsdr rtlsdr "$RTLSDR_SHA" "$RTLSDR_PATCHES" -DDETACH_KERNEL_DRIVER=ON
          build_patched libairspy libairspy airspy "$AIRSPY_SHA" "$AIRSPY_PATCHES" \
            -DINSTALL_UDEV_RULES=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Update deps manifest
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$DEPS_PREFIX"
          mf="$DEPS_PREFIX/.manifest"
          {
            echo "mbe_sha=${{ steps.dep-shas.outputs.mbe_sha }}"
            echo "codec2_sha=${{ steps.dep-shas.outputs.codec2_sha }}"
            echo "rtlsdr_sha=${{ steps.dep-shas.outputs.rtlsdr_sha }}"
            echo "airspy_sha=${{ steps.dep-shas.outputs.airspy_sha }}"
            echo "rtlsdr_patches=${{ steps.dep-shas.outputs.rtlsdr_patches }}"
            echo "airspy_patches=${{ steps.dep-shas.outputs.airspy_patches }}"
            echo "updated=$(date -u +%FT%TZ)"
          } > "$mf"

      - name: Show dependency versions
        shell: bash
        run: |
          set -euxo pipefail
          pkg-config --modversion codec2 || true
          pkg-config --modversion librtlsdr || true
          pkg-config --modversion SoapySDR || true
          pkg-config --modversion libpulse || true
          pkg-config --modversion sndfile || true

      - name: Configure (Release preset)
        shell: bash
        run: |
          # No curses overrides on purpose: this is the discovery path a user
          # gets, and pinning it here is what kept issue #339 out of CI.
          cmake --preset dev-release -G Ninja \
            -DDSD_ENABLE_LTO=OFF -DDSD_ENABLE_NATIVE=OFF -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DDSD_REQUIRE_RTLSDR=ON -DDSD_REQUIRE_SOAPYSDR=ON -DDSD_REQUIRE_AIRSPY=ON \
            -DBUILD_TESTING=OFF

      - name: Verify dsd-neo links the patched libairspy and librtlsdr
        shell: bash
        run: |
          set -euo pipefail
          cache=build/dev-release/CMakeCache.txt
          airspy=$(sed -n 's/^AIRSPY_LIBRARY:FILEPATH=//p' "$cache")
          rtlsdr=$(sed -n 's/^RTLSDR_LIBRARY:FILEPATH=//p' "$cache")
          for lib in "$airspy" "$rtlsdr"; do
            case "$lib" in
              "$DEPS_PREFIX"/*) ;;
              *) echo "ERROR: dsd-neo links '$lib', not a patched build in $DEPS_PREFIX" >&2; exit 1 ;;
            esac
          done
          tools/check_patched_usb_libs.sh --airspy "$airspy" --rtlsdr "$rtlsdr"

      - name: Verify curses selection
        shell: bash
        run: |
          set -euo pipefail
          # Discovery is unpinned here on purpose, so assert the outcome: the
          # portable DMG is built against Homebrew's wide ncurses, and a silent
          # downgrade to the SDK's narrow curses must not pass unnoticed.
          lib=$(sed -n 's/^CURSES_NCURSES_LIBRARY:[A-Z]*=//p' build/dev-release/CMakeCache.txt)
          echo "CURSES_NCURSES_LIBRARY=$lib"
          case "$lib" in
            *ncursesw*) ;;
            *) echo "ERROR: expected a wide ncurses, got '$lib'" >&2; exit 1 ;;
          esac

      - name: Build
        shell: bash
        run: |
          cmake --build --preset dev-release -j

      - name: Smoke test - show CLI help
        shell: bash
        run: |
          ./build/dev-release/apps/dsd-cli/dsd-neo -h || true

      - name: Verify release hardening
        shell: bash
        run: |
          tools/check_release_hardening.sh build/dev-release/apps/dsd-cli/dsd-neo build/dev-release
