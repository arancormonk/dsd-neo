name: macos-pr

# A job an `if:` skips still reports a check run under its name, as a success. In a
# workflow that a push or a dispatch can also start, a skipped run of a required
# pull-request job on a pull request's head commit could stand in for the real
# one, so the required jobs that only make sense on a pull request live here, in a
# workflow that nothing else starts, and carry no event condition.
#
# macos-ci keeps the push, tag and dispatch jobs (the DMG) and the Debug ctest
# job, which runs on every event.

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A classifier error or missing output runs the affected checks in full.
  changes:
    if: github.event_name == 'pull_request'
    # Keep the local workflow syntax understood by actionlint 1.7.12.
    uses: ./.github/workflows/ci-changes.yml # zizmor: ignore[self-repository]

  build-portable-dmg:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.native_needed != 'false') }}
    runs-on: macos-latest
    concurrency:
      group: ci-worker-13
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compute dependency SHAs (for cache key)
        id: dep-shas
        shell: bash
        run: |
          set -euo pipefail
          {
            source tools/ci-dependency-pins.env
            echo "rtlsdr_sha=$RTL_SDR_SHA"
            echo "airspy_sha=$AIRSPY_SHA"
            # dsd-neo's libairspy and librtlsdr patches (tools/usb_dependency_patches.sh).
            echo "airspy_patches=$(tools/usb_dependency_patches.sh digest libairspy)"
            echo "rtlsdr_patches=$(tools/usb_dependency_patches.sh digest librtlsdr)"
            # The patched libraries link vcpkg's libusb and take the triplet's deployment target.
            echo "vcpkg_key=${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/arm64-osx-dynamic-release.cmake', 'vcpkg-ports/**') }}"
          } >> "$GITHUB_OUTPUT"

      # Every library the DMG bundles comes from vcpkg (vcpkg.json at its builtin-baseline,
      # the overlays in vcpkg-ports/ and this triplet), except librtlsdr and libairspy,
      # which the job builds from their pins with dsd-neo's patches. Homebrew supplies
      # build tools only, so nothing from it is on a search path.
      - name: Prepare dependency environment
        shell: bash
        run: |
          set -euxo pipefail
          triplet=arm64-osx-dynamic-release
          target=$(sed -n 's/^set(VCPKG_OSX_DEPLOYMENT_TARGET "\([0-9.]*\)")$/\1/p' "vcpkg-triplets/$triplet.cmake")
          test -n "$target"
          {
            echo "DEPS_PREFIX=${GITHUB_WORKSPACE}/.deps"
            echo "VCPKG_TRIPLET=$triplet"
            echo "VCPKG_TRIPLET_DIR=${GITHUB_WORKSPACE}/vcpkg_installed/$triplet"
            echo "VCPKG_DEFAULT_BINARY_CACHE=${GITHUB_WORKSPACE}/.vcpkg-archives"
            echo "DSD_MACOS_DEPLOYMENT_TARGET=$target"
            echo "PKG_CONFIG_PATH=${GITHUB_WORKSPACE}/.deps/lib/pkgconfig"
            echo "CMAKE_PREFIX_PATH=${GITHUB_WORKSPACE}/.deps"
            echo "DYLD_LIBRARY_PATH=${GITHUB_WORKSPACE}/.deps/lib"
          } >> "$GITHUB_ENV"
          mkdir -p "${GITHUB_WORKSPACE}/.vcpkg-archives"

      # Its own key family: this tree holds the patched libairspy and librtlsdr,
      # which the test job's cache does not.
      - name: Restore dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: deps-dmg-vcpkg-${{ runner.os }}-${{ steps.dep-shas.outputs.rtlsdr_sha }}-${{ steps.dep-shas.outputs.airspy_sha }}-${{ steps.dep-shas.outputs.rtlsdr_patches }}-${{ steps.dep-shas.outputs.airspy_patches }}-${{ steps.dep-shas.outputs.vcpkg_key }}
          restore-keys: |
            deps-dmg-vcpkg-${{ runner.os }}-

      - name: Validate dependency cache
        shell: bash
        run: |
          set -euxo pipefail
          mf="$DEPS_PREFIX/.manifest"
          if [ -d "$DEPS_PREFIX" ]; then
            if [ -f "$mf" ] &&
               grep -Fxq "rtlsdr_sha=${{ steps.dep-shas.outputs.rtlsdr_sha }}" "$mf" &&
               grep -Fxq "airspy_sha=${{ steps.dep-shas.outputs.airspy_sha }}" "$mf" &&
               grep -Fxq "rtlsdr_patches=${{ steps.dep-shas.outputs.rtlsdr_patches }}" "$mf" &&
               grep -Fxq "airspy_patches=${{ steps.dep-shas.outputs.airspy_patches }}" "$mf" &&
               grep -Fxq "vcpkg_key=${{ steps.dep-shas.outputs.vcpkg_key }}" "$mf"; then
              echo "Dependency cache manifest matches requested SHAs"
            else
              echo "Dependency cache manifest is missing or stale; clearing $DEPS_PREFIX"
              rm -rf "$DEPS_PREFIX"
            fi
          fi
          mkdir -p "$DEPS_PREFIX"

      - name: Install build tools (Homebrew)
        shell: bash
        run: |
          set -euxo pipefail
          # Build tools only: vcpkg's autotools ports (libusb, ncurses) need autoconf,
          # automake and libtool, and vcpkg finds pkg-config on the PATH. No library
          # the DMG bundles comes from Homebrew.
          brew install cmake ninja pkg-config ccache autoconf automake libtool
          brew --version
          cmake --version
          pkg-config --version

      - name: Prepare ccache environment
        shell: bash
        run: |
          set -euxo pipefail
          {
            echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache"
            echo "CC=ccache clang"
            echo "CXX=ccache clang++"
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_SLOPPINESS=time_macros"
          } >> "$GITHUB_ENV"
          mkdir -p "${GITHUB_WORKSPACE}/.ccache"

      # Restore only: macos-ci's push runs save this cache.
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Initialize ccache
        shell: bash
        run: |
          ccache --version
          ccache --zero-stats
          ccache --set-config=max_size=500M
          ccache --set-config=compression=true

      # Keyed like the Android jobs' vcpkg cache: the manifest, its configuration, the
      # triplet and the overlay ports. vcpkg checks each archive's ABI hash itself, so a
      # partial restore only saves the ports that did not change.
      # Restore only: macos-ci's DMG job saves these archives.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-arm64-osx-dynamic-release-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/arm64-osx-dynamic-release.cmake', 'vcpkg-ports/**') }}
          restore-keys: |
            vcpkg-arm64-osx-dynamic-release-

      # vcpkg's bootstrap fetches the vcpkg-tool binary with `curl --retry 3`,
      # but curl only spends that retry budget on timeouts and 5xx/429
      # responses: a connection-level failure -- curl 35, "Recv failure:
      # Connection reset by peer" -- aborts on the first attempt and fails the
      # job before any of our code is built. --retry-all-errors extends the
      # existing budget to those resets. It goes in a curlrc because run-vcpkg
      # invokes bootstrap-vcpkg.sh itself, so there is no command line of ours
      # to add it to, and because it then also covers the curl calls vcpkg
      # makes for port sources.
      - name: Make curl retry connection resets
        shell: bash
        run: |
          set -euo pipefail
          cat > "$HOME/.curlrc" << 'EOF'
          retry = 3
          retry-all-errors
          retry-delay = 5
          EOF

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          # run-vcpkg requires a full 40-char SHA1.
          # Keep this in sync with vcpkg.json's builtin-baseline.
          vcpkgGitCommitId: "9eec002df1cd109f8f104cd966a763daf9751489"

      # The compilers, not ccache: vcpkg keys its archives on the compiler it detects.
      - name: Install vcpkg dependencies
        shell: bash
        run: |
          set -euxo pipefail
          env -u CC -u CXX "$VCPKG_ROOT/vcpkg" install \
            --triplet "$VCPKG_TRIPLET" \
            --overlay-triplets "$GITHUB_WORKSPACE/vcpkg-triplets" \
            --x-manifest-root "$GITHUB_WORKSPACE" \
            --x-install-root "$GITHUB_WORKSPACE/vcpkg_installed"
          test -f "$VCPKG_TRIPLET_DIR/lib/libusb-1.0.0.dylib"
          test -d "$VCPKG_TRIPLET_DIR/share/ncurses/terminfo"

      # The pinned sources with dsd-neo's transfer patches (tools/usb_dependency_patches.sh),
      # never a system copy: these are the libraries the DMG bundles. They link vcpkg's
      # libusb, the one dsd-neo loads, and are built for the triplet's deployment target.
      - name: Build patched librtlsdr and libairspy (cached)
        shell: bash
        env:
          RTLSDR_SHA: ${{ steps.dep-shas.outputs.rtlsdr_sha }}
          RTLSDR_PATCHES: ${{ steps.dep-shas.outputs.rtlsdr_patches }}
          AIRSPY_SHA: ${{ steps.dep-shas.outputs.airspy_sha }}
          AIRSPY_PATCHES: ${{ steps.dep-shas.outputs.airspy_patches }}
        run: |
          set -euxo pipefail
          mf="$DEPS_PREFIX/.manifest"
          build_patched() {
            local lib="$1" pc="$2" mf_prefix="$3" sha="$4" patches="$5"
            shift 5
            if { [ -f "$DEPS_PREFIX/lib/pkgconfig/$pc.pc" ] || [ -f "$DEPS_PREFIX/lib64/pkgconfig/$pc.pc" ]; } &&
               [ -f "$mf" ] && grep -Fxq "${mf_prefix}_sha=$sha" "$mf" &&
               grep -Fxq "${mf_prefix}_patches=$patches" "$mf"; then
              echo "Using cached patched $lib in $DEPS_PREFIX"
              return
            fi
            tools/usb_dependency_patches.sh fetch "$lib" "/tmp/$lib"
            PKG_CONFIG_PATH="$VCPKG_TRIPLET_DIR/lib/pkgconfig" \
              cmake -S "/tmp/$lib" -B "/tmp/$lib/build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" \
              -DCMAKE_PREFIX_PATH="$VCPKG_TRIPLET_DIR" \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET="$DSD_MACOS_DEPLOYMENT_TARGET" "$@"
            cmake --build "/tmp/$lib/build" -j
            cmake --install "/tmp/$lib/build"
          }
          build_patched librtlsdr librtlsdr rtlsdr "$RTLSDR_SHA" "$RTLSDR_PATCHES" -DDETACH_KERNEL_DRIVER=ON
          build_patched libairspy libairspy airspy "$AIRSPY_SHA" "$AIRSPY_PATCHES" \
            -DINSTALL_UDEV_RULES=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          # Each must load the libusb vcpkg built, not one a runner image happens to carry.
          for dylib in "$DEPS_PREFIX"/lib/librtlsdr.0.dylib "$DEPS_PREFIX"/lib/libairspy.0.dylib; do
            usb=$(otool -L "$dylib" | awk 'NR > 1 && /libusb-1\.0/ { print $1 }')
            case "$usb" in
              @rpath/libusb-1.0.0.dylib | "$VCPKG_TRIPLET_DIR"/lib/libusb-1.0.0.dylib) ;;
              *) echo "ERROR: $dylib loads '$usb', not vcpkg's libusb" >&2; exit 1 ;;
            esac
          done

      - name: Update deps manifest
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$DEPS_PREFIX"
          mf="$DEPS_PREFIX/.manifest"
          {
            echo "rtlsdr_sha=${{ steps.dep-shas.outputs.rtlsdr_sha }}"
            echo "airspy_sha=${{ steps.dep-shas.outputs.airspy_sha }}"
            echo "rtlsdr_patches=${{ steps.dep-shas.outputs.rtlsdr_patches }}"
            echo "airspy_patches=${{ steps.dep-shas.outputs.airspy_patches }}"
            echo "vcpkg_key=${{ steps.dep-shas.outputs.vcpkg_key }}"
            echo "updated=$(date -u +%FT%TZ)"
          } > "$mf"

      - name: Show dependency versions
        shell: bash
        run: |
          set -euxo pipefail
          "$VCPKG_ROOT/vcpkg" list \
            --x-manifest-root "$GITHUB_WORKSPACE" \
            --x-install-root "$GITHUB_WORKSPACE/vcpkg_installed" || true
          pkg-config --modversion librtlsdr || true

      - name: Configure (macos-arm64-release preset)
        shell: bash
        run: |
          set -euo pipefail
          # No curses overrides on purpose: this is the discovery path a user
          # gets, and pinning it here is what kept issue #339 out of CI.
          # VCPKG_MANIFEST_INSTALL=OFF: the step above installed the manifest
          # with the plain compilers; installing again here, with ccache as CC,
          # would give every port a new ABI hash and build them all again.
          log="$RUNNER_TEMP/configure-macos.log"
          cmake --preset macos-arm64-release -G Ninja \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DDSD_ENABLE_LTO=OFF -DDSD_ENABLE_NATIVE=OFF 2>&1 | tee "$log"
          # The preset requires these, so configure already failed if one was
          # missing; assert the outcome a user hears and sees too.
          grep -F "Audio backend: PortAudio" "$log"
          grep -F "Codec2 available: ON (M17 voice)" "$log"
          grep -F "libcurl available: ON (rdio API uploads)" "$log"
          grep -F "expat available: ON (RadioReference import)" "$log"

      - name: Verify dsd-neo links the patched libairspy and librtlsdr
        shell: bash
        run: |
          set -euo pipefail
          cache=build/macos-arm64-release/CMakeCache.txt
          airspy=$(sed -n 's/^AIRSPY_LIBRARY:FILEPATH=//p' "$cache")
          rtlsdr=$(sed -n 's/^RTLSDR_LIBRARY:FILEPATH=//p' "$cache")
          for lib in "$airspy" "$rtlsdr"; do
            case "$lib" in
              "$DEPS_PREFIX"/*) ;;
              *) echo "ERROR: dsd-neo links '$lib', not a patched build in $DEPS_PREFIX" >&2; exit 1 ;;
            esac
          done
          tools/check_patched_usb_libs.sh --airspy "$airspy" --rtlsdr "$rtlsdr"

      - name: Verify curses and codec2 selection
        shell: bash
        run: |
          set -euo pipefail
          # Discovery is unpinned here on purpose, so assert the outcome: the
          # portable DMG is built against vcpkg's wide ncurses and the pinned
          # codec2, and a silent fall-back to the SDK's narrow curses or to any
          # other copy must not pass unnoticed.
          cache=build/macos-arm64-release/CMakeCache.txt
          for var in CURSES_NCURSES_LIBRARY CODEC2_LIBRARY; do
            lib=$(sed -n "s/^$var:[A-Z]*=//p" "$cache")
            echo "$var=$lib"
            case "$lib" in
              "$VCPKG_TRIPLET_DIR"/*) ;;
              *) echo "ERROR: $var is '$lib', not from $VCPKG_TRIPLET_DIR" >&2; exit 1 ;;
            esac
          done
          case "$(sed -n 's/^CURSES_NCURSES_LIBRARY:[A-Z]*=//p' "$cache")" in
            *ncursesw*) ;;
            *) echo "ERROR: expected a wide ncurses" >&2; exit 1 ;;
          esac

      - name: Build
        shell: bash
        run: |
          cmake --build --preset macos-arm64-release -j

      - name: Smoke test - show CLI help
        shell: bash
        run: |
          ./build/macos-arm64-release/apps/dsd-cli/dsd-neo -h || true
      - name: Verify release hardening
        shell: bash
        run: |
          tools/check_release_hardening.sh build/macos-arm64-release/apps/dsd-cli/dsd-neo build/macos-arm64-release
