name: codeql

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "23 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ matrix.ci_group }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - language: c-cpp
            ci_group: ci-worker-03
            build-mode: manual
          - language: actions
            ci_group: ci-fast-2
            build-mode: ""
          - language: python
            ci_group: ci-fast-1
            build-mode: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        if: matrix.build-mode == ''
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Initialize CodeQL with build mode
        if: matrix.build-mode != ''
        # Overlay analysis cannot trace a manual C/C++ build.
        env:
          CODEQL_OVERLAY_DATABASE_MODE: none
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Install C/C++ build dependencies
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config git \
            libsndfile1-dev libpulse-dev libncurses-dev \
            libusb-1.0-0-dev libfftw3-dev libblas-dev liblapack-dev gfortran \
            libcodec2-dev librtlsdr-dev libsoapysdr-dev libcurl4-openssl-dev libexpat1-dev

      - name: Build and install mbelib-neo
        if: matrix.language == 'c-cpp'
        run: |
          set -euxo pipefail
          source tools/ci-dependency-pins.env
          tools/fetch-pinned-git.sh https://github.com/arancormonk/mbelib-neo "$MBELIB_NEO_SHA" /tmp/mbelib-neo
          cmake -S /tmp/mbelib-neo -B /tmp/mbelib-neo/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DMBELIB_ENABLE_NATIVE=OFF -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local"
          cmake --build /tmp/mbelib-neo/build -j
          cmake --install /tmp/mbelib-neo/build

      - name: Prepare local dependency environment
        if: matrix.language == 'c-cpp'
        run: |
          {
            echo "PKG_CONFIG_PATH=$HOME/.local/lib/pkgconfig:$HOME/.local/lib64/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "CMAKE_PREFIX_PATH=$HOME/.local:${CMAKE_PREFIX_PATH:-}"
            echo "LD_LIBRARY_PATH=$HOME/.local/lib:$HOME/.local/lib64:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"

      - name: Configure C/C++ database build
        if: matrix.language == 'c-cpp'
        run: |
          cmake --preset dev-debug \
            -DDSD_ENABLE_RTLSDR=ON \
            -DDSD_REQUIRE_RTLSDR=ON \
            -DDSD_ENABLE_SOAPYSDR=ON \
            -DDSD_REQUIRE_SOAPYSDR=ON

      - name: Build C/C++ database
        if: matrix.language == 'c-cpp'
        run: cmake --build --preset dev-debug -j

      # A traced C/C++ build analyzes every file it compiles, paths-ignore or
      # not, so the results are filtered against the config before upload.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          upload: failure-only
          output: ${{ runner.temp }}/codeql-sarif

      - name: Drop paths-ignore results
        env:
          SARIF_DIR: ${{ runner.temp }}/codeql-sarif
        run: python3 tools/sarif_drop_ignored_paths.py --config .github/codeql/codeql-config.yml "$SARIF_DIR"

      - name: Upload CodeQL results
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif
