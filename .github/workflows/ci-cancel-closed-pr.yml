# SPDX-License-Identifier: GPL-3.0-or-later
name: ci-cancel-closed-pr

on:
  pull_request_target:
    types: [closed]
    branches: [main, master]

permissions:
  contents: read

jobs:
  cancel:
    name: Cancel closed PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ci-control
      cancel-in-progress: false
      queue: max
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      # The cleanup program comes only from the trusted default branch. Never
      # check out or execute the PR head in this privileged workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: tools/ci_cancel_closed_pr.py
          sparse-checkout-cone-mode: false
      - name: Cancel obsolete runs
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 tools/ci_cancel_closed_pr.py --repository "$CI_REPOSITORY" --pr "$CI_PR_NUMBER"
