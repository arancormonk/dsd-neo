name: macos-ci

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
    tags:
      - "v*.*.*"
    paths-ignore:
      - ".*"
      - "**/*.md"
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A classifier error or missing output runs the affected checks in full.
  changes:
    if: github.event_name == 'pull_request'
    # Keep the local workflow syntax understood by actionlint 1.7.12.
    uses: ./.github/workflows/ci-changes.yml # zizmor: ignore[self-repository]

  # Debug build plus the full ctest suite on the shipped macOS architecture. The
  # DMG jobs build Release with tests off, so without this job no test ever ran
  # against AppleClang, libc++, ld64 or BSD libc. Runs on push as well, so main
  # keeps a warm ccache for pull requests.
  test-debug-arm64:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.native_needed != 'false') }}
    name: macOS • Debug • ctest (arm64)
    runs-on: macos-latest
    concurrency:
      group: ci-worker-13
      cancel-in-progress: false
      queue: max
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute dependency SHAs (for cache key)
        id: dep-shas
        shell: bash
        run: |
          set -euo pipefail
          {
            source tools/ci-dependency-pins.env
            echo "mbe_sha=$MBELIB_NEO_SHA"
            echo "codec2_sha=$CODEC2_SHA"
            echo "rtlsdr_sha=$RTL_SDR_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare dependency environment
        shell: bash
        run: |
          set -euxo pipefail
          # Homebrew locations (arm64=/opt/homebrew, x86_64=/usr/local)
          HB_PREFIX=$(brew --prefix)
          {
            echo "DEPS_PREFIX=${GITHUB_WORKSPACE}/.deps"
            echo "HB_PREFIX=$HB_PREFIX"
            echo "PKG_CONFIG_PATH=${GITHUB_WORKSPACE}/.deps/lib/pkgconfig:${GITHUB_WORKSPACE}/.deps/lib64/pkgconfig:${HB_PREFIX}/lib/pkgconfig:/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "CMAKE_PREFIX_PATH=${GITHUB_WORKSPACE}/.deps:${HB_PREFIX}:/usr/local:${CMAKE_PREFIX_PATH:-}"
            echo "DYLD_LIBRARY_PATH=${GITHUB_WORKSPACE}/.deps/lib:${GITHUB_WORKSPACE}/.deps/lib64:${DYLD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"

      - name: Restore dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: deps-${{ runner.os }}-${{ steps.dep-shas.outputs.mbe_sha }}-${{ steps.dep-shas.outputs.codec2_sha }}-${{ steps.dep-shas.outputs.rtlsdr_sha }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Validate dependency cache
        shell: bash
        run: |
          set -euxo pipefail
          mf="$DEPS_PREFIX/.manifest"
          if [ -d "$DEPS_PREFIX" ]; then
            if [ -f "$mf" ] &&
               grep -Fxq "mbe_sha=${{ steps.dep-shas.outputs.mbe_sha }}" "$mf" &&
               grep -Fxq "codec2_sha=${{ steps.dep-shas.outputs.codec2_sha }}" "$mf" &&
               grep -Fxq "rtlsdr_sha=${{ steps.dep-shas.outputs.rtlsdr_sha }}" "$mf"; then
              echo "Dependency cache manifest matches requested SHAs"
            else
              echo "Dependency cache manifest is missing or stale; clearing $DEPS_PREFIX"
              rm -rf "$DEPS_PREFIX"
            fi
          fi
          mkdir -p "$DEPS_PREFIX"

      - name: Install base toolchain + libs (Homebrew)
        shell: bash
        run: |
          set -euxo pipefail
          # Many deps we build from source (cached) to align with Linux/Windows flows
          # bash: the TOOLS_* ctest cases need bash >= 4; /bin/bash is 3.2.
          # ripgrep and gcc: two of them need rg, and TOOLS_GCC_FANALYZER needs GNU
          # GCC's analyzer; each prints SKIP and passes without its tool.
          brew install cmake ninja pkg-config ccache bash ripgrep gcc \
            libsndfile pulseaudio fftw libusb ncurses soapysdr airspy
          # Prefer Homebrew packages when available
          brew install codec2 rtl-sdr || true
          brew --version
          cmake --version
          pkg-config --version

      - name: Prepare ccache environment
        shell: bash
        run: |
          set -euxo pipefail
          {
            echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache"
            echo "CC=ccache clang"
            echo "CXX=ccache clang++"
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_SLOPPINESS=time_macros"
          } >> "$GITHUB_ENV"
          mkdir -p "${GITHUB_WORKSPACE}/.ccache"

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-debug-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-debug-${{ runner.os }}-

      - name: Initialize ccache
        shell: bash
        run: |
          ccache --version
          ccache --zero-stats
          ccache --set-config=max_size=300M
          ccache --set-config=compression=true

      - name: Build and install mbelib-neo (required, cached)
        shell: bash
        run: |
          set -euxo pipefail
          mf="$DEPS_PREFIX/.manifest"
          want_sha='${{ steps.dep-shas.outputs.mbe_sha }}'
          pc1="$DEPS_PREFIX/lib/pkgconfig/libmbe-neo.pc"
          pc2="$DEPS_PREFIX/lib64/pkgconfig/libmbe-neo.pc"
          if [ -f "$pc1" ] || [ -f "$pc2" ]; then
            if [ -f "$mf" ] && grep -q "^mbe_sha=$want_sha$" "$mf"; then
              echo "Using cached mbelib-neo in $DEPS_PREFIX"
              exit 0
            fi
            echo "Cached mbelib-neo does not match desired SHA; rebuilding"
          fi
          tools/fetch-pinned-git.sh https://github.com/arancormonk/mbelib-neo "$want_sha" /tmp/mbelib-neo
          cmake -S /tmp/mbelib-neo -B /tmp/mbelib-neo/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DMBELIB_ENABLE_NATIVE=OFF -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build /tmp/mbelib-neo/build -j
          cmake --install /tmp/mbelib-neo/build

      - name: Ensure codec2 (cached fallback if not found)
        shell: bash
        run: |
          set -euxo pipefail
          mf="$DEPS_PREFIX/.manifest"
          want_sha='${{ steps.dep-shas.outputs.codec2_sha }}'
          pc1="$DEPS_PREFIX/lib/pkgconfig/codec2.pc"
          pc2="$DEPS_PREFIX/lib64/pkgconfig/codec2.pc"
          if [ -f "$pc1" ] || [ -f "$pc2" ]; then
            if [ -f "$mf" ] && grep -q "^codec2_sha=$want_sha$" "$mf"; then
              echo "Using cached codec2 in $DEPS_PREFIX"
              exit 0
            fi
            echo "Cached codec2 does not match desired SHA; rebuilding"
          else
            if pkg-config --exists codec2; then
              echo "Using system codec2"
              exit 0
            fi
          fi
          tools/fetch-pinned-git.sh https://github.com/arancormonk/codec2 "$want_sha" /tmp/codec2
          cmake -S /tmp/codec2 -B /tmp/codec2/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build /tmp/codec2/build -j
          cmake --install /tmp/codec2/build

      - name: Ensure RTL-SDR (cached fallback if not found)
        shell: bash
        run: |
          set -euxo pipefail
          mf="$DEPS_PREFIX/.manifest"
          want_sha='${{ steps.dep-shas.outputs.rtlsdr_sha }}'
          pc1="$DEPS_PREFIX/lib/pkgconfig/librtlsdr.pc"
          pc2="$DEPS_PREFIX/lib64/pkgconfig/librtlsdr.pc"
          if [ -f "$pc1" ] || [ -f "$pc2" ]; then
            if [ -f "$mf" ] && grep -q "^rtlsdr_sha=$want_sha$" "$mf"; then
              echo "Using cached rtl-sdr in $DEPS_PREFIX"
              exit 0
            fi
            echo "Cached rtl-sdr does not match desired SHA; rebuilding"
          else
            if pkg-config --exists librtlsdr; then
              echo "Using system rtl-sdr"
              exit 0
            fi
          fi
          tools/fetch-pinned-git.sh https://github.com/arancormonk/rtl-sdr "$want_sha" /tmp/rtl-sdr
          cmake -S /tmp/rtl-sdr -B /tmp/rtl-sdr/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DDETACH_KERNEL_DRIVER=ON \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build /tmp/rtl-sdr/build -j
          cmake --install /tmp/rtl-sdr/build

      - name: Update deps manifest
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$DEPS_PREFIX"
          mf="$DEPS_PREFIX/.manifest"
          {
            echo "mbe_sha=${{ steps.dep-shas.outputs.mbe_sha }}"
            echo "codec2_sha=${{ steps.dep-shas.outputs.codec2_sha }}"
            echo "rtlsdr_sha=${{ steps.dep-shas.outputs.rtlsdr_sha }}"
            echo "updated=$(date -u +%FT%TZ)"
          } > "$mf"

      - name: Show dependency versions
        shell: bash
        run: |
          set -euxo pipefail
          pkg-config --modversion codec2 || true
          pkg-config --modversion librtlsdr || true
          pkg-config --modversion SoapySDR || true
          pkg-config --modversion libpulse || true
          pkg-config --modversion sndfile || true

      # The DESKTOP_* transfer tests build these, the sources the DMG ships.
      - name: Fetch the patched libairspy and librtlsdr sources
        shell: bash
        run: tools/usb_dependency_patches.sh fetch-all "$RUNNER_TEMP/desktop-usb"

      - name: Configure (dev-debug)
        shell: bash
        run: |
          cmake --preset dev-debug -G Ninja \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DDSD_REQUIRE_RTLSDR=ON -DDSD_REQUIRE_SOAPYSDR=ON -DDSD_REQUIRE_AIRSPY=ON \
            -DDSD_TEST_DESKTOP_USB_SOURCES="$RUNNER_TEMP/desktop-usb"

      # -k 0 keeps going past a failed target, so one run reports every compile
      # error on a platform that is not reproduced locally.
      - name: Build (dev-debug)
        shell: bash
        run: cmake --build --preset dev-debug -j -- -k 0

      # macOS's gcc is AppleClang. TOOLS_GCC_FANALYZER runs GNU GCC's analyzer
      # through a bare gcc, so the test step finds Homebrew's GCC under that
      # name; the build above keeps the AppleClang that configure recorded.
      - name: Put GNU GCC on PATH as gcc for the test step
        shell: bash
        run: |
          set -euxo pipefail
          gnu_gcc=$(find "$(brew --prefix gcc)/bin" -maxdepth 1 -name 'gcc-[0-9]*' | sort -V | tail -n 1)
          "$gnu_gcc" --version
          mkdir -p "$RUNNER_TEMP/gnu-gcc"
          ln -sf "$gnu_gcc" "$RUNNER_TEMP/gnu-gcc/gcc"

      - name: Test (dev-debug)
        shell: bash
        env:
          # A test whose tool is missing fails here instead of skipping.
          DSD_NEO_REQUIRE_TEST_TOOLS: "1"
        run: |
          export PATH="$RUNNER_TEMP/gnu-gcc:$PATH"
          gcc --version | head -n 1
          ctest --preset dev-debug -N | tail -n 1
          ctest --preset dev-debug --parallel 2 --output-on-failure

      - name: Show ccache stats
        if: always()
        shell: bash
        run: ccache --show-stats

      # Pull requests restore the cache main saved and never save their own: one
      # cache per pull-request push filled the 10 GB repository limit and evicted
      # main's caches, so every run started cold.
      - name: Save ccache
        if: github.event_name != 'pull_request' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}

  package-portable-dmg:
    name: Package portable DMG
    runs-on: macos-latest
    concurrency:
      group: ci-worker-13
      cancel-in-progress: false
      queue: max
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      # The DMG's general legal files; tools/check_release_notices.py takes every
      # component notice from the macos_release maps in legal/components.json.
      DMG_REQUIRED_DOCS: LICENSE COPYRIGHT THIRD_PARTY.md legal/status.md legal/components.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: release
        shell: bash
        env:
          RELEASE_TAG_CREATED: ${{ github.event.created }}
        run: tools/ci_validate_release_tag.sh

      - name: Compute dependency SHAs (for cache key)
        id: dep-shas
        shell: bash
        run: |
          set -euo pipefail
          {
            source tools/ci-dependency-pins.env
            echo "rtlsdr_sha=$RTL_SDR_SHA"
            echo "airspy_sha=$AIRSPY_SHA"
            # dsd-neo's libairspy and librtlsdr patches (tools/usb_dependency_patches.sh).
            echo "airspy_patches=$(tools/usb_dependency_patches.sh digest libairspy)"
            echo "rtlsdr_patches=$(tools/usb_dependency_patches.sh digest librtlsdr)"
            # The patched libraries link vcpkg's libusb and take the triplet's deployment target.
            echo "vcpkg_key=${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/arm64-osx-dynamic-release.cmake', 'vcpkg-ports/**') }}"
          } >> "$GITHUB_OUTPUT"

      # Every library the DMG bundles comes from vcpkg (vcpkg.json at its builtin-baseline,
      # the overlays in vcpkg-ports/ and this triplet), except librtlsdr and libairspy,
      # which the job builds from their pins with dsd-neo's patches. Homebrew supplies
      # build tools only, so nothing from it is on a search path.
      - name: Prepare dependency environment
        shell: bash
        run: |
          set -euxo pipefail
          triplet=arm64-osx-dynamic-release
          target=$(sed -n 's/^set(VCPKG_OSX_DEPLOYMENT_TARGET "\([0-9.]*\)")$/\1/p' "vcpkg-triplets/$triplet.cmake")
          test -n "$target"
          {
            echo "DEPS_PREFIX=${GITHUB_WORKSPACE}/.deps"
            echo "VCPKG_TRIPLET=$triplet"
            echo "VCPKG_TRIPLET_DIR=${GITHUB_WORKSPACE}/vcpkg_installed/$triplet"
            echo "VCPKG_DEFAULT_BINARY_CACHE=${GITHUB_WORKSPACE}/.vcpkg-archives"
            echo "DSD_MACOS_DEPLOYMENT_TARGET=$target"
            echo "PKG_CONFIG_PATH=${GITHUB_WORKSPACE}/.deps/lib/pkgconfig"
            echo "CMAKE_PREFIX_PATH=${GITHUB_WORKSPACE}/.deps"
            echo "DYLD_LIBRARY_PATH=${GITHUB_WORKSPACE}/.deps/lib"
          } >> "$GITHUB_ENV"
          mkdir -p "${GITHUB_WORKSPACE}/.vcpkg-archives"

      # Its own key family: this tree holds the patched libairspy and librtlsdr,
      # which the test job's cache does not.
      - name: Restore dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: deps-dmg-vcpkg-${{ runner.os }}-${{ steps.dep-shas.outputs.rtlsdr_sha }}-${{ steps.dep-shas.outputs.airspy_sha }}-${{ steps.dep-shas.outputs.rtlsdr_patches }}-${{ steps.dep-shas.outputs.airspy_patches }}-${{ steps.dep-shas.outputs.vcpkg_key }}
          restore-keys: |
            deps-dmg-vcpkg-${{ runner.os }}-

      - name: Validate dependency cache
        shell: bash
        run: |
          set -euxo pipefail
          mf="$DEPS_PREFIX/.manifest"
          if [ -d "$DEPS_PREFIX" ]; then
            if [ -f "$mf" ] &&
               grep -Fxq "rtlsdr_sha=${{ steps.dep-shas.outputs.rtlsdr_sha }}" "$mf" &&
               grep -Fxq "airspy_sha=${{ steps.dep-shas.outputs.airspy_sha }}" "$mf" &&
               grep -Fxq "rtlsdr_patches=${{ steps.dep-shas.outputs.rtlsdr_patches }}" "$mf" &&
               grep -Fxq "airspy_patches=${{ steps.dep-shas.outputs.airspy_patches }}" "$mf" &&
               grep -Fxq "vcpkg_key=${{ steps.dep-shas.outputs.vcpkg_key }}" "$mf"; then
              echo "Dependency cache manifest matches requested SHAs"
            else
              echo "Dependency cache manifest is missing or stale; clearing $DEPS_PREFIX"
              rm -rf "$DEPS_PREFIX"
            fi
          fi
          mkdir -p "$DEPS_PREFIX"

      - name: Install build tools (Homebrew)
        shell: bash
        run: |
          set -euxo pipefail
          # Build tools only: vcpkg's autotools ports (libusb, ncurses) need autoconf,
          # automake and libtool, and vcpkg finds pkg-config on the PATH. No library
          # the DMG bundles comes from Homebrew.
          brew install cmake ninja pkg-config ccache autoconf automake libtool
          brew --version
          cmake --version
          pkg-config --version

      - name: Prepare ccache environment
        shell: bash
        run: |
          set -euxo pipefail
          {
            echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache"
            echo "CC=ccache clang"
            echo "CXX=ccache clang++"
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_SLOPPINESS=time_macros"
          } >> "$GITHUB_ENV"
          mkdir -p "${GITHUB_WORKSPACE}/.ccache"

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Initialize ccache
        shell: bash
        run: |
          ccache --version
          ccache --zero-stats
          ccache --set-config=max_size=500M
          ccache --set-config=compression=true

      # Keyed like the Android jobs' vcpkg cache: the manifest, its configuration, the
      # triplet and the overlay ports. vcpkg checks each archive's ABI hash itself, so a
      # partial restore only saves the ports that did not change.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-arm64-osx-dynamic-release-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/arm64-osx-dynamic-release.cmake', 'vcpkg-ports/**') }}
          restore-keys: |
            vcpkg-arm64-osx-dynamic-release-

      # vcpkg's bootstrap fetches the vcpkg-tool binary with `curl --retry 3`,
      # but curl only spends that retry budget on timeouts and 5xx/429
      # responses: a connection-level failure -- curl 35, "Recv failure:
      # Connection reset by peer" -- aborts on the first attempt and fails the
      # job before any of our code is built. --retry-all-errors extends the
      # existing budget to those resets. It goes in a curlrc because run-vcpkg
      # invokes bootstrap-vcpkg.sh itself, so there is no command line of ours
      # to add it to, and because it then also covers the curl calls vcpkg
      # makes for port sources.
      - name: Make curl retry connection resets
        shell: bash
        run: |
          set -euo pipefail
          cat > "$HOME/.curlrc" << 'EOF'
          retry = 3
          retry-all-errors
          retry-delay = 5
          EOF

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          # run-vcpkg requires a full 40-char SHA1.
          # Keep this in sync with vcpkg.json's builtin-baseline.
          vcpkgGitCommitId: "9eec002df1cd109f8f104cd966a763daf9751489"

      # The compilers, not ccache: vcpkg keys its archives on the compiler it detects.
      - name: Install vcpkg dependencies
        shell: bash
        run: |
          set -euxo pipefail
          env -u CC -u CXX "$VCPKG_ROOT/vcpkg" install \
            --triplet "$VCPKG_TRIPLET" \
            --overlay-triplets "$GITHUB_WORKSPACE/vcpkg-triplets" \
            --x-manifest-root "$GITHUB_WORKSPACE" \
            --x-install-root "$GITHUB_WORKSPACE/vcpkg_installed"
          test -f "$VCPKG_TRIPLET_DIR/lib/libusb-1.0.0.dylib"
          test -d "$VCPKG_TRIPLET_DIR/share/ncurses/terminfo"

      # Pull requests restore the archives main saved and never save their own,
      # for the reason given at "Save ccache".
      - name: Save vcpkg binary cache
        if: github.event_name != 'pull_request' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # The pinned sources with dsd-neo's transfer patches (tools/usb_dependency_patches.sh),
      # never a system copy: these are the libraries the DMG bundles. They link vcpkg's
      # libusb, the one dsd-neo loads, and are built for the triplet's deployment target.
      - name: Build patched librtlsdr and libairspy (cached)
        shell: bash
        env:
          RTLSDR_SHA: ${{ steps.dep-shas.outputs.rtlsdr_sha }}
          RTLSDR_PATCHES: ${{ steps.dep-shas.outputs.rtlsdr_patches }}
          AIRSPY_SHA: ${{ steps.dep-shas.outputs.airspy_sha }}
          AIRSPY_PATCHES: ${{ steps.dep-shas.outputs.airspy_patches }}
        run: |
          set -euxo pipefail
          mf="$DEPS_PREFIX/.manifest"
          build_patched() {
            local lib="$1" pc="$2" mf_prefix="$3" sha="$4" patches="$5"
            shift 5
            if { [ -f "$DEPS_PREFIX/lib/pkgconfig/$pc.pc" ] || [ -f "$DEPS_PREFIX/lib64/pkgconfig/$pc.pc" ]; } &&
               [ -f "$mf" ] && grep -Fxq "${mf_prefix}_sha=$sha" "$mf" &&
               grep -Fxq "${mf_prefix}_patches=$patches" "$mf"; then
              echo "Using cached patched $lib in $DEPS_PREFIX"
              return
            fi
            tools/usb_dependency_patches.sh fetch "$lib" "/tmp/$lib"
            PKG_CONFIG_PATH="$VCPKG_TRIPLET_DIR/lib/pkgconfig" \
              cmake -S "/tmp/$lib" -B "/tmp/$lib/build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" \
              -DCMAKE_PREFIX_PATH="$VCPKG_TRIPLET_DIR" \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET="$DSD_MACOS_DEPLOYMENT_TARGET" "$@"
            cmake --build "/tmp/$lib/build" -j
            cmake --install "/tmp/$lib/build"
          }
          build_patched librtlsdr librtlsdr rtlsdr "$RTLSDR_SHA" "$RTLSDR_PATCHES" -DDETACH_KERNEL_DRIVER=ON
          build_patched libairspy libairspy airspy "$AIRSPY_SHA" "$AIRSPY_PATCHES" \
            -DINSTALL_UDEV_RULES=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          # Each must load the libusb vcpkg built, not one a runner image happens to carry.
          for dylib in "$DEPS_PREFIX"/lib/librtlsdr.0.dylib "$DEPS_PREFIX"/lib/libairspy.0.dylib; do
            usb=$(otool -L "$dylib" | awk 'NR > 1 && /libusb-1\.0/ { print $1 }')
            case "$usb" in
              @rpath/libusb-1.0.0.dylib | "$VCPKG_TRIPLET_DIR"/lib/libusb-1.0.0.dylib) ;;
              *) echo "ERROR: $dylib loads '$usb', not vcpkg's libusb" >&2; exit 1 ;;
            esac
          done

      - name: Update deps manifest
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$DEPS_PREFIX"
          mf="$DEPS_PREFIX/.manifest"
          {
            echo "rtlsdr_sha=${{ steps.dep-shas.outputs.rtlsdr_sha }}"
            echo "airspy_sha=${{ steps.dep-shas.outputs.airspy_sha }}"
            echo "rtlsdr_patches=${{ steps.dep-shas.outputs.rtlsdr_patches }}"
            echo "airspy_patches=${{ steps.dep-shas.outputs.airspy_patches }}"
            echo "vcpkg_key=${{ steps.dep-shas.outputs.vcpkg_key }}"
            echo "updated=$(date -u +%FT%TZ)"
          } > "$mf"

      - name: Show dependency versions
        shell: bash
        run: |
          set -euxo pipefail
          "$VCPKG_ROOT/vcpkg" list \
            --x-manifest-root "$GITHUB_WORKSPACE" \
            --x-install-root "$GITHUB_WORKSPACE/vcpkg_installed" || true
          pkg-config --modversion librtlsdr || true

      - name: Configure (macos-arm64-release preset)
        shell: bash
        run: |
          set -euo pipefail
          # No curses overrides on purpose: this is the discovery path a user
          # gets, and pinning it here is what kept issue #339 out of CI.
          # VCPKG_MANIFEST_INSTALL=OFF: the step above installed the manifest
          # with the plain compilers; installing again here, with ccache as CC,
          # would give every port a new ABI hash and build them all again.
          log="$RUNNER_TEMP/configure-macos.log"
          cmake --preset macos-arm64-release -G Ninja \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DDSD_ENABLE_LTO=OFF -DDSD_ENABLE_NATIVE=OFF 2>&1 | tee "$log"
          # The preset requires these, so configure already failed if one was
          # missing; assert the outcome a user hears and sees too.
          grep -F "Audio backend: PortAudio" "$log"
          grep -F "Codec2 available: ON (M17 voice)" "$log"
          grep -F "libcurl available: ON (rdio API uploads)" "$log"
          grep -F "expat available: ON (RadioReference import)" "$log"

      - name: Verify dsd-neo links the patched libairspy and librtlsdr
        shell: bash
        run: |
          set -euo pipefail
          cache=build/macos-arm64-release/CMakeCache.txt
          airspy=$(sed -n 's/^AIRSPY_LIBRARY:FILEPATH=//p' "$cache")
          rtlsdr=$(sed -n 's/^RTLSDR_LIBRARY:FILEPATH=//p' "$cache")
          for lib in "$airspy" "$rtlsdr"; do
            case "$lib" in
              "$DEPS_PREFIX"/*) ;;
              *) echo "ERROR: dsd-neo links '$lib', not a patched build in $DEPS_PREFIX" >&2; exit 1 ;;
            esac
          done
          tools/check_patched_usb_libs.sh --airspy "$airspy" --rtlsdr "$rtlsdr"

      - name: Verify curses and codec2 selection
        shell: bash
        run: |
          set -euo pipefail
          # Discovery is unpinned here on purpose, so assert the outcome: the
          # portable DMG is built against vcpkg's wide ncurses and the pinned
          # codec2, and a silent fall-back to the SDK's narrow curses or to any
          # other copy must not pass unnoticed.
          cache=build/macos-arm64-release/CMakeCache.txt
          for var in CURSES_NCURSES_LIBRARY CODEC2_LIBRARY; do
            lib=$(sed -n "s/^$var:[A-Z]*=//p" "$cache")
            echo "$var=$lib"
            case "$lib" in
              "$VCPKG_TRIPLET_DIR"/*) ;;
              *) echo "ERROR: $var is '$lib', not from $VCPKG_TRIPLET_DIR" >&2; exit 1 ;;
            esac
          done
          case "$(sed -n 's/^CURSES_NCURSES_LIBRARY:[A-Z]*=//p' "$cache")" in
            *ncursesw*) ;;
            *) echo "ERROR: expected a wide ncurses" >&2; exit 1 ;;
          esac

      - name: Build
        shell: bash
        run: |
          cmake --build --preset macos-arm64-release -j

      - name: Smoke test - show CLI help
        shell: bash
        run: |
          ./build/macos-arm64-release/apps/dsd-cli/dsd-neo -h || true
      - name: Stage portable tree
        if: github.event_name != 'pull_request'
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          BUILD="build/macos-arm64-release"
          EXE="$BUILD/apps/dsd-cli/dsd-neo"
          test -f "$EXE"
          STAGE="dist/dsd-neo-macos"
          mkdir -p "$STAGE/bin" "$STAGE/lib"
          cp -f "$EXE" "$STAGE/bin/"

          # Copy docs/launchers
          cp -f packaging/macos/README-macos.txt "$STAGE/" || true
          cp -f packaging/macos/dsd-neo.sh "$STAGE/" || true
          chmod +x "$STAGE/dsd-neo.sh" || true
          # The bundled ncurses reads its terminal database at runtime. The
          # database is data rather than a dylib, so otool-based dependency
          # staging will not discover it. vcpkg-ports/ncurses installs it from
          # the same ncurses source, in the hexadecimal layout macOS uses.
          TERMINFO_SRC="$VCPKG_TRIPLET_DIR/share/ncurses/terminfo"
          if [ ! -d "$TERMINFO_SRC" ]; then
            echo "ERROR: vcpkg's ncurses installed no terminfo database at $TERMINFO_SRC" >&2
            exit 1
          fi
          rm -rf "$STAGE/share/terminfo"
          mkdir -p "$STAGE/share/terminfo"
          cp -a "$TERMINFO_SRC"/. "$STAGE/share/terminfo"/
          if [ ! -f "$STAGE/share/terminfo/78/xterm-256color" ]; then
            echo "ERROR: staged terminfo database is missing 78/xterm-256color" >&2
            exit 1
          fi

          # Bundle license/notice files
          cmake --install "$BUILD" --prefix dist/dsd-neo-macos --component legal
          DOCDIR="$STAGE/share/doc/dsd-neo"
          mkdir -p "$DOCDIR/licenses"
          cp -f LICENSE COPYRIGHT THIRD_PARTY.md "$DOCDIR/"
          # The notices of every component the DMG carries, as each record's
          # macos_release map in legal/components.json names them: repository
          # files, the build tree's PFFFT and TETRA_crypto notices, and the
          # copyright file each vcpkg port installs.
          cmake -DPLATFORM=macos -DREPO_DIR="$GITHUB_WORKSPACE" -DBUILD_DIR="$BUILD" \
            -DDOC_DIR="$DOCDIR" -DVCPKG_SHARE_DIR="$VCPKG_TRIPLET_DIR/share" \
            -P cmake/stage_release_notices.cmake
          read -ra required_docs <<< "$DMG_REQUIRED_DOCS"
          python3 tools/check_release_notices.py --platform macos --doc-dir "$DOCDIR" \
            --build-dir "$BUILD" --vcpkg-share "$VCPKG_TRIPLET_DIR/share" --require "${required_docs[@]}"

          list_rpaths() {
            local file="$1"
            otool -l "$file" | awk '
              /cmd LC_RPATH/ { in_rpath = 1; next }
              in_rpath && /^[[:space:]]*path / { print $2; in_rpath = 0 }
            '
          }

          resolve_rpath_dep() {
            local file="$1"
            local dep="$2"
            local suffix="${dep#@rpath/}"
            local loader_dir exe_dir rpath resolved candidate
            loader_dir=$(cd "$(dirname "$file")" && pwd)
            exe_dir=$(cd "$STAGE/bin" && pwd)

            while IFS= read -r rpath; do
              case "$rpath" in
                @loader_path) resolved="$loader_dir" ;;
                @loader_path/*) resolved="$loader_dir/${rpath#@loader_path/}" ;;
                @executable_path) resolved="$exe_dir" ;;
                @executable_path/*) resolved="$exe_dir/${rpath#@executable_path/}" ;;
                *) resolved="$rpath" ;;
              esac
              candidate="$resolved/$suffix"
              if [ -f "$candidate" ]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done < <(list_rpaths "$file")

            # A vcpkg dylib loads its neighbours through @loader_path, which
            # for the staged copy is $STAGE/lib, where they may not be yet: look
            # in the trees the build linked against.
            for resolved in "$VCPKG_TRIPLET_DIR/lib" "$DEPS_PREFIX/lib"; do
              candidate="$resolved/$suffix"
              if [ -f "$candidate" ]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done

            return 1
          }

          resolve_dep_path() {
            local file="$1"
            local dep="$2"
            local loader_dir exe_dir rel candidate

            case "$dep" in
              /usr/lib/*|/System/*) return 1 ;;
              @rpath/*)
                resolve_rpath_dep "$file" "$dep"
                ;;
              @loader_path/*)
                loader_dir=$(cd "$(dirname "$file")" && pwd)
                rel="${dep#@loader_path/}"
                candidate="$loader_dir/$rel"
                [ -f "$candidate" ] && printf '%s\n' "$candidate"
                ;;
              @executable_path/*)
                exe_dir=$(cd "$STAGE/bin" && pwd)
                rel="${dep#@executable_path/}"
                candidate="$exe_dir/$rel"
                [ -f "$candidate" ] && printf '%s\n' "$candidate"
                ;;
              *)
                [ -f "$dep" ] && printf '%s\n' "$dep"
                ;;
            esac
          }

          # Helper: collect dylib deps of a file and copy non-system libs into $STAGE/lib
          collect_deps() {
            local file="$1"
            local libs lib base resolved
            libs=$(otool -L "$file" | tail -n +2 | awk '{print $1}')
            for lib in $libs; do
              # Skip system libraries
              case "$lib" in
                /usr/lib/*|/System/*) continue;;
              esac
              base=$(basename "$lib")
              # Prefer copied version if we already staged it
              if [ ! -f "$STAGE/lib/$base" ]; then
                # Resolve @rpath/@loader_path dependencies and potential symlinks.
                if ! resolved=$(resolve_dep_path "$file" "$lib"); then
                  echo "ERROR: cannot resolve $lib, which $file loads" >&2
                  exit 1
                fi
                # Only vcpkg's tree and the patched librtlsdr and libairspy
                # may reach the DMG, never a library from the runner image.
                case "$resolved" in
                  "$VCPKG_TRIPLET_DIR"/lib/* | "$DEPS_PREFIX"/lib/*) ;;
                  *) echo "ERROR: $file loads $resolved, outside vcpkg's tree and $DEPS_PREFIX" >&2; exit 1 ;;
                esac
                cp -f "$resolved" "$STAGE/lib/$base"
              fi
            done
          }

          # Initial pass for the main binary
          collect_deps "$STAGE/bin/dsd-neo"
          # Iterate to capture transitive deps (cap at 5 passes)
          pass=1
          while [ $pass -le 5 ]; do
            changed=0
            for lib in "$STAGE"/lib/*.dylib; do
              [ -f "$lib" ] || continue
              before=$(find "$STAGE/lib" -mindepth 1 -maxdepth 1 -type f | wc -l)
              collect_deps "$lib"
              after=$(find "$STAGE/lib" -mindepth 1 -maxdepth 1 -type f | wc -l)
              if [ "$after" -gt "$before" ]; then changed=1; fi
            done
            [ "$changed" -eq 0 ] && break
            pass=$((pass+1))
          done

          # Normalize install names for staged libs and rebasing binary to @rpath
          add_rpath() {
            local bin="$1"
            local rpath="$2"
            if ! list_rpaths "$bin" | grep -Fxq "$rpath"; then
              install_name_tool -add_rpath "$rpath" "$bin"
            fi
          }

          strip_absolute_rpaths() {
            local bin="$1"
            local rpath
            while IFS= read -r rpath; do
              case "$rpath" in
                /*) install_name_tool -delete_rpath "$rpath" "$bin" ;;
              esac
            done < <(list_rpaths "$bin")
          }

          add_rpath "$STAGE/bin/dsd-neo" "@executable_path/../lib"

          # Set id for staged libs and change references in the main binary
          for lib in "$STAGE"/lib/*.dylib; do
            [ -f "$lib" ] || continue
            base=$(basename "$lib")
            install_name_tool -id "@rpath/$base" "$lib"
            add_rpath "$lib" "@loader_path"
          done

          # Rewire binary deps to @rpath when we staged the lib
          while IFS= read -r line; do
            dep=$(echo "$line" | awk '{print $1}')
            case "$dep" in /usr/lib/*|/System/*|$STAGE/*) continue;; esac
            base=$(basename "$dep")
            if [ -f "$STAGE/lib/$base" ]; then
              new_dep="@rpath/$base"
              if [ "$dep" != "$new_dep" ]; then
                install_name_tool -change "$dep" "$new_dep" "$STAGE/bin/dsd-neo"
              fi
            fi
          done < <(otool -L "$STAGE/bin/dsd-neo" | tail -n +2)

          # Also update references inside each staged lib to other staged libs
          for tgt in "$STAGE"/lib/*.dylib; do
            [ -f "$tgt" ] || continue
            while IFS= read -r line; do
              dep=$(echo "$line" | awk '{print $1}')
              case "$dep" in /usr/lib/*|/System/*|$STAGE/*) continue;; esac
              base=$(basename "$dep")
              if [ -f "$STAGE/lib/$base" ]; then
                new_dep="@rpath/$base"
                if [ "$dep" != "$new_dep" ]; then
                  install_name_tool -change "$dep" "$new_dep" "$tgt"
                fi
              fi
            done < <(otool -L "$tgt" | tail -n +2)
          done

          strip_absolute_rpaths "$STAGE/bin/dsd-neo"
          for lib in "$STAGE"/lib/*.dylib; do
            [ -f "$lib" ] || continue
            strip_absolute_rpaths "$lib"
          done

          # Emit manifest for auditing
          find "$STAGE/lib" -maxdepth 1 -type f -name '*.dylib' -exec basename {} \; | sort -f > "$STAGE/dylibs-manifest.txt"

      - name: Verify the bundled libairspy and librtlsdr are the patched builds
        shell: bash
        run: |
          set -euo pipefail
          staged() {
            local found
            found=$(find dist/dsd-neo-macos/lib -maxdepth 1 -type f -name "$1*.dylib")
            if [ -z "$found" ] || [ "$(printf '%s\n' "$found" | wc -l)" -ne 1 ]; then
              echo "ERROR: the portable tree must bundle exactly one $1, not: $found" >&2
              return 1
            fi
            echo "$found"
          }
          airspy=$(staged libairspy)
          rtlsdr=$(staged librtlsdr)
          tools/check_patched_usb_libs.sh --airspy "$airspy" --rtlsdr "$rtlsdr"

      - name: Sign staged Mach-O files
        shell: bash
        run: |
          set -euo pipefail
          sign_and_verify() {
            local file="$1"
            codesign --force --sign - "$file"
            codesign --verify --strict --verbose=2 "$file"
          }

          find dist/dsd-neo-macos/lib -maxdepth 1 -type f -name '*.dylib' -print0 |
            while IFS= read -r -d '' lib; do
              sign_and_verify "$lib"
            done
          sign_and_verify dist/dsd-neo-macos/bin/dsd-neo

      - name: Verify staged release hardening
        shell: bash
        run: |
          set -euo pipefail
          tools/check_release_hardening.sh dist/dsd-neo-macos/bin/dsd-neo build/macos-arm64-release
          find dist/dsd-neo-macos/lib -maxdepth 1 -type f -name '*.dylib' -print0 |
            while IFS= read -r -d '' lib; do
              tools/check_release_hardening.sh "$lib" build/macos-arm64-release
            done
          tools/check_macos_portable_deps.sh dist/dsd-neo-macos "$DSD_MACOS_DEPLOYMENT_TARGET"

      - name: Smoke test staged binary
        shell: bash
        run: |
          set -euo pipefail
          STAGE="dist/dsd-neo-macos"
          "$STAGE/dsd-neo.sh" -h

      - name: Verify bundled terminfo
        shell: bash
        run: |
          set -euo pipefail
          STAGE="dist/dsd-neo-macos"
          if command -v infocmp > /dev/null 2>&1; then
            TERMINFO_DIRS="$STAGE/share/terminfo:/usr/share/terminfo" infocmp xterm-256color > /dev/null
          else
            echo "infocmp not available; terminfo payload checked by tools/check_macos_portable_deps.sh"
          fi

      - name: Create DMG
        id: dmg
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euxo pipefail
          stage='dist/dsd-neo-macos'
          arch='arm64'
          if [ "$REF_TYPE" = 'tag' ] && [ -n "$REF_NAME" ]; then
            dmg="dist/dsd-neo-macos-${arch}-portable-${REF_NAME}.dmg"
            artName="dsd-neo-macos-${arch}-portable-${REF_NAME}"
          else
            dmg="dist/dsd-neo-macos-${arch}-portable-nightly.dmg"
            artName="dsd-neo-macos-${arch}-portable-nightly"
          fi
          mkdir -p "$(dirname "$dmg")"
          [ -f "$dmg" ] && rm -f "$dmg"
          # Include the staged folder as a top-level directory inside the DMG
          imgroot="dist/.imgroot"
          rm -rf "$imgroot"
          mkdir -p "$imgroot"
          cp -a "$stage" "$imgroot/"
          # Create a compressed read-only DMG from imgroot (contains dsd-neo-macos/)
          hdiutil create -fs HFS+ -volname "dsd-neo" -srcfolder "$imgroot" -format UDZO -imagekey zlib-level=9 "$dmg"
          {
            echo "DMG_PATH=$dmg"
            echo "ART_NAME=$artName"
          } >> "$GITHUB_OUTPUT"

      - name: Verify DMG contents (mount and run help)
        shell: bash
        run: |
          set -euxo pipefail
          dmg='${{ steps.dmg.outputs.DMG_PATH }}'
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -noverify -mountpoint "$mnt"
          trap 'hdiutil detach "$mnt" -force || true' EXIT
          # Run help from inside the mounted DMG
          "$mnt/dsd-neo-macos/dsd-neo.sh" -h || (echo 'Running help from DMG failed' >&2; exit 1)
          # The DMG as a user gets it carries every notice its records name.
          read -ra required_docs <<< "$DMG_REQUIRED_DOCS"
          python3 tools/check_release_notices.py --platform macos \
            --doc-dir "$mnt/dsd-neo-macos/share/doc/dsd-neo" --build-dir build/macos-arm64-release \
            --vcpkg-share "$VCPKG_TRIPLET_DIR/share" --require "${required_docs[@]}"
          hdiutil detach "$mnt" -force
          trap - EXIT

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.dmg.outputs.ART_NAME }}
          path: ${{ steps.dmg.outputs.DMG_PATH }}
          retention-days: 7

      - name: Generate artifact SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ${{ steps.dmg.outputs.DMG_PATH }}
          format: spdx-json
          output-file: ${{ steps.dmg.outputs.DMG_PATH }}.spdx.json
          artifact-name: ${{ steps.dmg.outputs.ART_NAME }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Record pinned PFFFT and TETRA_crypto in SBOM
        shell: bash
        env:
          SBOM_PATH: ${{ steps.dmg.outputs.DMG_PATH }}.spdx.json
          ASSET_PATH: ${{ steps.dmg.outputs.DMG_PATH }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python tools/pffft_metadata.py --spdx "$SBOM_PATH"
            python tools/tetra_crypto_metadata.py --spdx "$SBOM_PATH"
            python tools/legal_inventory.py --spdx "$SBOM_PATH" --platform macos
            python tools/sbom_file_records.py --spdx "$SBOM_PATH" --asset "$ASSET_PATH"
          else
            python3 tools/pffft_metadata.py --spdx "$SBOM_PATH"
            python3 tools/tetra_crypto_metadata.py --spdx "$SBOM_PATH"
            python3 tools/legal_inventory.py --spdx "$SBOM_PATH" --platform macos
            python3 tools/sbom_file_records.py --spdx "$SBOM_PATH" --asset "$ASSET_PATH"
          fi

      - name: Upload enriched SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.dmg.outputs.ART_NAME }}.spdx.json
          path: ${{ steps.dmg.outputs.DMG_PATH }}.spdx.json
          retention-days: 7

      - name: Attest artifact provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.dmg.outputs.DMG_PATH }}

      - name: Attest artifact SBOM
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.dmg.outputs.DMG_PATH }}
          sbom-path: ${{ steps.dmg.outputs.DMG_PATH }}.spdx.json

      # Pull requests restore the cache main saved and never save their own: one
      # cache per pull-request push filled the 10 GB repository limit and evicted
      # main's caches, so every run started cold.
      - name: Save ccache
        if: github.event_name != 'pull_request' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}

  publish-portable-dmg:
    name: Publish portable DMG
    needs: package-portable-dmg
    runs-on: ubuntu-latest
    concurrency:
      group: ci-fast-2
      cancel-in-progress: false
      queue: max
    if: >-
      github.repository == 'arancormonk/dsd-neo' &&
      (startsWith(github.ref, 'refs/tags/v') ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')))
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release helpers
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare artifact naming
        id: names
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          arch='arm64'
          if [ "$REF_TYPE" = 'tag' ] && [ -n "$REF_NAME" ]; then
            dmg="dist/dsd-neo-macos-${arch}-portable-${REF_NAME}.dmg"
            artName="dsd-neo-macos-${arch}-portable-${REF_NAME}"
            title="dsd-neo ${REF_NAME#v}"
          else
            dmg="dist/dsd-neo-macos-${arch}-portable-nightly.dmg"
            artName="dsd-neo-macos-${arch}-portable-nightly"
            title="nightly"
          fi
          mkdir -p dist
          {
            echo "DMG_PATH=$dmg"
            echo "ART_NAME=$artName"
            echo "RELEASE_TITLE=$title"
          } >> "$GITHUB_OUTPUT"
      - name: Download package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.names.outputs.ART_NAME }}
          path: dist
      - name: Download package SBOM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.names.outputs.ART_NAME }}.spdx.json
          path: dist
      # upload-artifact preserves the SBOM basename, including the package extension.
      - name: Verify downloaded release files
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ steps.names.outputs.DMG_PATH }}"
          test -f "${{ steps.names.outputs.DMG_PATH }}.spdx.json"
      - name: Wait for release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: tools/ci_wait_for_release.sh
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          DMG_PATH: ${{ steps.names.outputs.DMG_PATH }}
          SBOM_PATH: ${{ steps.names.outputs.DMG_PATH }}.spdx.json
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" \
            "${DMG_PATH}" \
            "${SBOM_PATH}" \
            --repo "${RELEASE_REPOSITORY}" \
            --clobber
      - name: Upload nightly assets (overwrite)
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: nightly
          name: nightly
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.names.outputs.DMG_PATH }}
            ${{ steps.names.outputs.DMG_PATH }}.spdx.json
          overwrite_files: true
          fail_on_unmatched_files: true
          token: ${{ github.token }}
