name: windows-ci

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
    tags:
      - "v*.*.*"
    paths-ignore:
      - ".*"
      - "**/*.md"
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-native-msvc:
    name: Package native MSVC ZIP
    runs-on: windows-latest
    concurrency:
      group: ci-worker-12
      cancel-in-progress: false
      queue: max
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
      packages: write
    env:
      # Use a release-only triplet to avoid building debug variants of vcpkg deps.
      VCPKG_DEFAULT_TRIPLET: x64-windows-dynamic-release
      VCPKG_TARGET_TRIPLET: x64-windows-dynamic-release
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\vcpkg-triplets
      # vcpkg removed the GitHub Actions binary cache backend; use GitHub Packages via NuGet.
      VCPKG_EXE: ${{ github.workspace }}/vcpkg/vcpkg.exe
      VCPKG_NUGET_FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      VCPKG_NUGET_USER: ${{ github.repository_owner }}
      VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite"
      # Enable sccache GitHub Actions backend.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: release
        shell: bash
        env:
          RELEASE_TAG_CREATED: ${{ github.event.created }}
        run: tools/ci_validate_release_tag.sh

      - name: Run sccache-cache
        id: sccache
        # A cache-service outage must not prevent an uncached release build.
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba

      - name: Initialize sccache
        if: steps.sccache.outcome == 'success'
        shell: pwsh
        run: |
          & $env:SCCACHE_PATH --version
          & $env:SCCACHE_PATH --zero-stats

      - name: Setup MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: x64

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          # run-vcpkg v11.6 requires a full 40-char SHA1.
          # Keep this in sync with vcpkg.json's builtin-baseline.
          vcpkgGitCommitId: "9eec002df1cd109f8f104cd966a763daf9751489"

      - name: Configure vcpkg binary cache
        shell: pwsh
        env:
          VCPKG_NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $nuget = (& $env:VCPKG_EXE fetch nuget | Select-Object -Last 1)
          if (-not $nuget) { throw "vcpkg fetch nuget did not return a path" }

          & $nuget sources add `
            -Source "$env:VCPKG_NUGET_FEED" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "$env:VCPKG_NUGET_USER" `
            -Password "$env:VCPKG_NUGET_TOKEN" `
            -NonInteractive

          & $nuget setapikey "$env:VCPKG_NUGET_TOKEN" `
            -Source "$env:VCPKG_NUGET_FEED" `
            -NonInteractive

      - name: Install vcpkg dependencies (MSVC)
        shell: pwsh
        run: vcpkg install --triplet $env:VCPKG_DEFAULT_TRIPLET --overlay-triplets "$env:GITHUB_WORKSPACE\\vcpkg-triplets" --x-manifest-root "$env:GITHUB_WORKSPACE"

      - name: Configure (MSVC Release)
        shell: pwsh
        env:
          DSD_COMPILER_LAUNCHER: ${{ steps.sccache.outcome == 'success' && 'sccache' || '' }}
        run: |
          cmake --preset win-msvc-release `
            -DDSD_ENABLE_NATIVE=OFF `
            -DCMAKE_C_COMPILER_LAUNCHER="$env:DSD_COMPILER_LAUNCHER" `
            -DCMAKE_CXX_COMPILER_LAUNCHER="$env:DSD_COMPILER_LAUNCHER" `
            -DDSD_REQUIRE_RTLSDR=ON `
            -DDSD_REQUIRE_AIRSPY=ON `
            -DDSD_REQUIRE_SOAPYSDR=ON

      - name: Build (MSVC Release)
        shell: pwsh
        run: cmake --build --preset win-msvc-release

      - name: Verify built release hardening (MSVC)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path 'build/win-msvc-release/apps/dsd-cli' -Recurse -Filter 'dsd-neo.exe' |
            Select-Object -First 1
          if ($null -eq $exe) { throw "dsd-neo.exe not found under build/win-msvc-release/apps/dsd-cli" }
          ./tools/check_release_hardening.ps1 $exe.FullName

      - name: Show sccache stats
        if: steps.sccache.outcome == 'success'
        shell: pwsh
        run: |
          & $env:SCCACHE_PATH --show-stats

      - name: Stage native MSVC tree
        if: github.event_name != 'pull_request'
        id: stage
        shell: pwsh
        run: >-
          ./tools/windows/stage_release_tree.ps1
          -BuildDir build/win-msvc-release
          -StageDir dist/dsd-neo-msvc
          -InstalledDir "$env:GITHUB_WORKSPACE/vcpkg_installed/$env:VCPKG_TARGET_TRIPLET"

      # The patched librtlsdr, hardening of every staged PE, the DLL closure and the
      # bundled SoapySDR modules, loaded without hardware.
      - name: Verify staged release tree (MSVC)
        shell: pwsh
        run: ./tools/windows/verify_release_tree.ps1 -Root dist/dsd-neo-msvc

      - name: Archive native MSVC ZIP
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $stage = 'dist/dsd-neo-msvc'
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME) {
            $zip = "dist/dsd-neo-msvc-x86_64-native-$($env:REF_NAME).zip"
            $artName = "dsd-neo-msvc-x86_64-native-$($env:REF_NAME)"
          } else {
            $zip = "dist/dsd-neo-msvc-x86_64-native-nightly.zip"
            $artName = "dsd-neo-msvc-x86_64-native-nightly"
          }
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage, $zip)
          echo "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "ART_NAME=$artName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        id: zip

      # The same checks on the ZIP unpacked into a new folder, as a user gets it.
      - name: Verify ZIP contents (extract and verify)
        shell: pwsh
        env:
          ZIP_PATH: ${{ steps.zip.outputs.ZIP_PATH }}
        run: |
          $zip = $env:ZIP_PATH
          if (!(Test-Path $zip)) { throw "ZIP not found: $zip" }
          $dest = Join-Path $env:RUNNER_TEMP ('dsd-neo-msvc-' + [System.Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip, $dest)
          ./tools/windows/verify_release_tree.ps1 -Root $dest

      - name: Upload native MSVC artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.zip.outputs.ART_NAME }}
          path: ${{ steps.zip.outputs.ZIP_PATH }}
          retention-days: 7

      - name: Generate native MSVC SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ${{ steps.zip.outputs.ZIP_PATH }}
          format: spdx-json
          output-file: ${{ steps.zip.outputs.ZIP_PATH }}.spdx.json
          artifact-name: ${{ steps.zip.outputs.ART_NAME }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Record pinned PFFFT and TETRA_crypto in SBOM
        shell: bash
        env:
          SBOM_PATH: ${{ steps.zip.outputs.ZIP_PATH }}.spdx.json
          ASSET_PATH: ${{ steps.zip.outputs.ZIP_PATH }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python tools/pffft_metadata.py --spdx "$SBOM_PATH"
            python tools/tetra_crypto_metadata.py --spdx "$SBOM_PATH"
            python tools/legal_inventory.py --spdx "$SBOM_PATH" --platform windows
            python tools/sbom_file_records.py --spdx "$SBOM_PATH" --asset "$ASSET_PATH"
          else
            python3 tools/pffft_metadata.py --spdx "$SBOM_PATH"
            python3 tools/tetra_crypto_metadata.py --spdx "$SBOM_PATH"
            python3 tools/legal_inventory.py --spdx "$SBOM_PATH" --platform windows
            python3 tools/sbom_file_records.py --spdx "$SBOM_PATH" --asset "$ASSET_PATH"
          fi

      - name: Upload enriched SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.zip.outputs.ART_NAME }}.spdx.json
          path: ${{ steps.zip.outputs.ZIP_PATH }}.spdx.json
          retention-days: 7

      - name: Attest native MSVC provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.zip.outputs.ZIP_PATH }}

      - name: Attest native MSVC SBOM
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.zip.outputs.ZIP_PATH }}
          sbom-path: ${{ steps.zip.outputs.ZIP_PATH }}.spdx.json

  publish-native-msvc:
    name: Publish native MSVC ZIP
    needs: package-native-msvc
    runs-on: ubuntu-latest
    concurrency:
      group: ci-fast-2
      cancel-in-progress: false
      queue: max
    if: >-
      github.repository == 'arancormonk/dsd-neo' &&
      (startsWith(github.ref, 'refs/tags/v') ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')))
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release helpers
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare artifact naming
        id: names
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = 'tag' ] && [ -n "$REF_NAME" ]; then
            zip="dist/dsd-neo-msvc-x86_64-native-${REF_NAME}.zip"
            artName="dsd-neo-msvc-x86_64-native-${REF_NAME}"
            title="dsd-neo ${REF_NAME#v}"
          else
            zip="dist/dsd-neo-msvc-x86_64-native-nightly.zip"
            artName="dsd-neo-msvc-x86_64-native-nightly"
            title="nightly"
          fi
          mkdir -p dist
          {
            echo "ZIP_PATH=$zip"
            echo "ART_NAME=$artName"
            echo "RELEASE_TITLE=$title"
          } >> "$GITHUB_OUTPUT"
      - name: Download package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.names.outputs.ART_NAME }}
          path: dist
      - name: Download package SBOM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.names.outputs.ART_NAME }}.spdx.json
          path: dist
      # upload-artifact preserves the SBOM basename, including the package extension.
      - name: Verify downloaded release files
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ steps.names.outputs.ZIP_PATH }}"
          test -f "${{ steps.names.outputs.ZIP_PATH }}.spdx.json"
      - name: Wait for release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: tools/ci_wait_for_release.sh
      - name: Upload native MSVC release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          ZIP_PATH: ${{ steps.names.outputs.ZIP_PATH }}
          SBOM_PATH: ${{ steps.names.outputs.ZIP_PATH }}.spdx.json
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" \
            "${ZIP_PATH}" \
            "${SBOM_PATH}" \
            --repo "${RELEASE_REPOSITORY}" \
            --clobber
      - name: Upload native MSVC nightly assets (overwrite)
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: nightly
          name: nightly
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.names.outputs.ZIP_PATH }}
            ${{ steps.names.outputs.ZIP_PATH }}.spdx.json
          overwrite_files: true
          fail_on_unmatched_files: true
          token: ${{ github.token }}
