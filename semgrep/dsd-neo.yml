rules:
  - id: dsd-neo.no-raw-memory-api
    languages: [c, cpp]
    severity: ERROR
    message: Use the dsd-neo safe API wrapper instead of the raw C memory/string API.
    paths:
      include:
        - /android/**
        - /apps/**
        - /include/**
        - /src/**
        - /tests/**
      exclude:
        - /include/dsd-neo/core/safe_api.h
        - /android/third_party/**
        - /src/third_party/**
    pattern-either:
      - pattern: memcpy(...)
      - pattern: memmove(...)
      - pattern: memset(...)
      - pattern: strcpy(...)
      - pattern: strncpy(...)
      - pattern: strcat(...)
      - pattern: strncat(...)
      - pattern: sprintf(...)
      - pattern: snprintf(...)
      - pattern: fprintf(...)
      - pattern: sscanf(...)

  - id: dsd-neo.no-shell-exec
    languages: [c, cpp]
    severity: ERROR
    message: Do not invoke shells or spawn processes from project-owned C/C++ code without explicit design review.
    paths:
      include:
        - /android/**
        - /apps/**
        - /include/**
        - /src/**
        - /tests/**
      exclude:
        - /android/third_party/**
        - /src/third_party/**
    pattern-either:
      - pattern: system(...)
      - pattern: popen(...)
      - pattern: execl(...)
      - pattern: execle(...)
      - pattern: execlp(...)
      - pattern: execv(...)
      - pattern: execve(...)
      - pattern: execvp(...)
      - pattern: posix_spawn(...)
      - pattern: posix_spawnp(...)

  - id: dsd-neo.no-static-array-parameter-bounds
    languages: [generic]
    severity: ERROR
    message: >
      Do not use C99 array parameter static bounds; MSVC rejects this syntax. Use an ordinary pointer or array
      declarator for portable project-owned C/C++ declarations.
    paths:
      include:
        - /android/**
        - /apps/**
        - /include/**
        - /src/**
        - /tests/**
      exclude:
        - /android/third_party/**
        - /src/third_party/**
    pattern-regex: '\[\s*static\b'

  - id: dsd-neo.no-automatic-full-decoder-state
    languages: [generic]
    severity: ERROR
    message: >
      Do not allocate dsd_state or dsd_opts as automatic locals; use heap allocation or intentional static storage so
      large decoder objects never consume stack space.
    paths:
      include:
        - /android/**
        - /apps/**
        - /include/**
        - /src/**
        - /tests/**
      exclude:
        - /android/third_party/**
        - /src/third_party/**
    pattern-regex: '^\s*(?!(?:static|thread_local)\b)(?:(?:const\s+)?(?:struct\s+)?(?:dsd_state|dsd_opts)\s+[A-Za-z_][A-Za-z0-9_]*\s*(?:=|\{|,|\[|;)|(?:const\s+)?auto\s+[A-Za-z_][A-Za-z0-9_]*\s*=\s*(?:dsd_state|dsd_opts)\s*(?:\{|\())'

  - id: dsd-neo.no-production-assert
    languages: [c, cpp]
    severity: ERROR
    message: >
      Use explicit runtime validation or unreachable handling in production code instead of assert(), which can compile
      out under NDEBUG.
    paths:
      include:
        - /android/**
        - /apps/**
        - /include/**
        - /src/**
      exclude:
        - /android/third_party/**
        - /src/third_party/**
    pattern: assert(...)

  - id: dsd-neo.no-floating-point-equality-in-tests
    languages: [c, cpp]
    severity: ERROR
    message: Compare floating-point test values with an explicit tolerance instead of == or !=.
    paths:
      include:
        - /tests/**
    pattern-either:
      - patterns:
          - pattern-inside: |
              $RET $FUNC(...) {
                ...
                double $FLOAT_VALUE = ...;
                ...
              }
          - pattern-either:
              - pattern: $OTHER == $FLOAT_VALUE
              - pattern: $OTHER != $FLOAT_VALUE
              - pattern: $FLOAT_VALUE == $OTHER
              - pattern: $FLOAT_VALUE != $OTHER
          - metavariable-regex:
              metavariable: $OTHER
              regex: '^[A-Za-z_]'
      - patterns:
          - pattern-inside: |
              $RET $FUNC(...) {
                ...
                float $FLOAT_VALUE = ...;
                ...
              }
          - pattern-either:
              - pattern: $OTHER == $FLOAT_VALUE
              - pattern: $OTHER != $FLOAT_VALUE
              - pattern: $FLOAT_VALUE == $OTHER
              - pattern: $FLOAT_VALUE != $OTHER
          - metavariable-regex:
              metavariable: $OTHER
              regex: '^[A-Za-z_]'

  - id: dsd-neo.no-weak-process-rng
    languages: [c, cpp]
    severity: ERROR
    message: >
      Do not use process-global rand()/srand(); use a purpose-specific RNG, nonce, or unique-name helper.
    paths:
      include:
        - /android/**
        - /apps/**
        - /include/**
        - /src/**
      exclude:
        - /android/third_party/**
        - /src/third_party/**
    pattern-either:
      - pattern: rand(...)
      - pattern: srand(...)

  - id: dsd-neo.no-atoi-family
    languages: [c, cpp]
    severity: ERROR
    message: Use checked strto* parsing or a project parse helper instead of atoi/atol/atoll/atof.
    paths:
      include:
        - /android/**
        - /apps/**
        - /include/**
        - /src/**
      exclude:
        - /android/third_party/**
        - /src/third_party/**
    pattern-either:
      - pattern: atoi(...)
      - pattern: atol(...)
      - pattern: atoll(...)
      - pattern: atof(...)
      - pattern: std::atoi(...)
      - pattern: std::atol(...)
      - pattern: std::atoll(...)
      - pattern: std::atof(...)

  - id: dsd-neo.no-unchecked-strto-endptr
    languages: [c, cpp]
    severity: ERROR
    message: Check the strto* end pointer and range instead of passing NULL for endptr.
    paths:
      include:
        - /android/**
        - /apps/**
        - /include/**
        - /src/**
      exclude:
        - /android/third_party/**
        - /src/third_party/**
    pattern-either:
      - pattern: strtol($S, NULL, $B)
      - pattern: strtoul($S, NULL, $B)
      - pattern: strtoll($S, NULL, $B)
      - pattern: strtoull($S, NULL, $B)
      - pattern: strtod($S, NULL)
      - pattern: strtof($S, NULL)
      - pattern: strtol($S, nullptr, $B)
      - pattern: strtoul($S, nullptr, $B)
      - pattern: strtoll($S, nullptr, $B)
      - pattern: strtoull($S, nullptr, $B)
      - pattern: strtod($S, nullptr)
      - pattern: strtof($S, nullptr)
      - pattern: std::strtol($S, NULL, $B)
      - pattern: std::strtoul($S, NULL, $B)
      - pattern: std::strtoll($S, NULL, $B)
      - pattern: std::strtoull($S, NULL, $B)
      - pattern: std::strtod($S, NULL)
      - pattern: std::strtof($S, NULL)
      - pattern: std::strtol($S, nullptr, $B)
      - pattern: std::strtoul($S, nullptr, $B)
      - pattern: std::strtoll($S, nullptr, $B)
      - pattern: std::strtoull($S, nullptr, $B)
      - pattern: std::strtod($S, nullptr)
      - pattern: std::strtof($S, nullptr)

  - id: dsd-neo.no-raw-file-open
    languages: [c, cpp]
    severity: ERROR
    message: Use project file/path compatibility helpers instead of raw file open/temp APIs in project-owned code.
    paths:
      include:
        - /android/**
        - /apps/**
        - /include/**
        - /src/**
      exclude:
        - /android/third_party/**
        - /src/third_party/**
        - /src/platform/file_compat_posix.c
        - /src/platform/file_compat_win32.c
        - /src/platform/posix_compat_posix.c
        - /src/platform/posix_compat_win32.c
        - /src/runtime/path_policy.c
    pattern-either:
      - pattern: fopen(...)
      - pattern: freopen(...)
      - pattern: open(...)
      - pattern: creat(...)
      - pattern: tmpfile(...)
      - pattern: tmpnam(...)
      - pattern: mktemp(...)
      - pattern: mkstemp(...)
      - pattern: mkstemps(...)

  - id: dsd-neo.no-sizeof-function-parameter-in-dsd-snprintf
    languages: [c, cpp]
    severity: ERROR
    message: Function parameters have pointer size in C; pass the explicit destination capacity to DSD_SNPRINTF.
    paths:
      include:
        - /android/**
        - /apps/**
        - /include/**
        - /src/**
        - /tests/**
      exclude:
        - /include/dsd-neo/core/safe_api.h
        - /android/third_party/**
        - /src/third_party/**
    pattern-either:
      - patterns:
          - pattern-inside: |
              $RET $FUNC(..., $TYPE *$DST, ...) {
                ...
              }
          - pattern: DSD_SNPRINTF($DST, sizeof($DST), ...)
      - patterns:
          - pattern-inside: |
              $RET $FUNC(..., $TYPE $DST[$N], ...) {
                ...
              }
          - pattern: DSD_SNPRINTF($DST, sizeof($DST), ...)

  - id: dsd-neo.no-escaped-control-char-in-format-string
    languages: [c, cpp]
    severity: ERROR
    message: >-
      Format string emits a literal backslash escape instead of the control character. "\\n" prints the two
      characters '\' and 'n', gluing the next output onto the current line; write "\n" for a real newline
      (likewise "\t" and "\r"). This is refactor fallout from mechanically rewriting fprintf call sites, and
      it has silently regressed DMR console and structured-output dumps more than once. If a literal escape
      sequence really is intended, emit it outside a format string or annotate the line with a narrow
      nosemgrep comment explaining why.
    paths:
      include:
        - /android/**
        - /apps/**
        - /include/**
        - /src/**
      exclude:
        - /android/third_party/**
        - /src/third_party/**
    patterns:
      - pattern-either:
          - pattern: DSD_FPRINTF($STREAM, $FMT, ...)
          - pattern: DSD_SNPRINTF($DST, $SZ, $FMT, ...)
          - pattern: DSD_VSNPRINTF($DST, $SZ, $FMT, $AP)
          - pattern: LOG_ERROR($FMT, ...)
          - pattern: LOG_WARN($FMT, ...)
          - pattern: LOG_INFO($FMT, ...)
          - pattern: LOG_DEBUG($FMT, ...)
          - pattern: printf($FMT, ...)
      - metavariable-regex:
          metavariable: $FMT
          regex: '.*\\\\[ntr].*'

  - id: dsd-neo.no-unbounded-byte-to-bit-unpack
    languages: [c, cpp]
    severity: ERROR
    message: >-
      Unbounded bit/byte conversion. A three-argument helper trusts the length against both buffers,
      which is how the P25 phase 2 talker alias and DMR type-1 assembly overflows reached the stack.
      Use dsd_unpack_bytes_to_bits()/dsd_pack_bits_to_bytes() (or the DSD_UNPACK_ARRAY_TO_BITS /
      DSD_PACK_ARRAY_TO_BYTES macros) so the span of both buffers is stated at the call.
    paths:
      # Production code only. Test fixtures build their inputs with local helpers whose
      # bounds are compile-time constants, and a reintroduced removed helper is a link
      # error there anyway.
      include:
        - /android/**
        - /apps/**
        - /include/**
        - /src/**
      exclude:
        - /android/third_party/**
        - /src/third_party/**
        - /include/dsd-neo/core/bit_packing.h
        - /src/core/util/bit_packing.c
    pattern-either:
      # The removed helpers, in case they are reintroduced by a copy-paste from upstream DSD.
      - pattern: unpack_byte_array_into_bit_array(...)
      - pattern: pack_bit_array_into_byte_array(...)
      # The same shape under any name: source, destination, single length. A literal length is
      # still unbounded with respect to the destination, so constant calls are rejected too.
      - patterns:
          - pattern-regex: \b\w*unpack_(byte|bytes)\w*\s*\(\s*[^;()]+,\s*[^;()]+,\s*[^;(),]+\s*\)
          - pattern-not: dsd_unpack_bytes_to_bits(...)
          - pattern-not: dsd_unpack_bytes_to_bits_truncating(...)
      - patterns:
          - pattern-regex: \b\w*pack_bit(s)?_\w*\s*\(\s*[^;()]+,\s*[^;()]+,\s*[^;(),]+\s*\)
          - pattern-not: dsd_pack_bits_to_bytes(...)
          - pattern-not: dsd_pack_bits_to_bytes_truncating(...)

  - id: dsd-neo.no-direct-third-party-include
    languages: [c, cpp]
    severity: ERROR
    message: Use a project-owned wrapper/target instead of directly including bundled third-party headers.
    paths:
      include:
        - /android/**
        - /apps/**
        - /include/**
        - /src/**
        - /tests/**
      exclude:
        - /android/third_party/**
        - /src/third_party/**
        - /src/fec/ez.cpp
        # The project-owned pffft wrapper. The two spectrum producers go through it
        # and are deliberately not listed here.
        - /src/io/radio/rtl_fft_cache.h
        - /tests/protocol/p25/test_p25_p2_rs28_limits.cpp
    pattern-either:
      - pattern: '#include "src/third_party/..."'
      - pattern: '#include <src/third_party/...>'
      - pattern: '#include "ezpwd/..."'
      - pattern: '#include <ezpwd/...>'
      - pattern: '#include "pffft.h"'
      - pattern: '#include <pffft.h>'

  - id: dsd-neo.github-actions.no-untrusted-context-in-run
    languages: [yaml]
    severity: ERROR
    message: Pass untrusted GitHub context through env or action inputs instead of interpolating it directly into a run block.
    paths:
      include:
        - /.github/workflows/*.yml
        - /.github/workflows/*.yaml
    patterns:
      - pattern: |
          run: $SCRIPT
      - metavariable-regex:
          metavariable: $SCRIPT
          regex: '(?s).*\$\{\{\s*github\.(?:head_ref|ref_name|event\.(?:issue\.(?:title|body)|comment\.body|pull_request\.(?:title|body)|pull_request\.head\.(?:ref|label)|pull_request\.head\.repo\.full_name)).*'
